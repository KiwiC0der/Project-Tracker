function vCalendar(el) {
  var base = S.calMonth ? new Date(S.calMonth) : new Date();
  base.setDate(1); base.setHours(0, 0, 0, 0);
  S.calMonth = base.getTime();

  var first = new Date(base);
  var startDow = first.getDay();
  var gridStart = new Date(first.getTime() - startDow * PT.DAY);
  var today = new Date(); today.setHours(0, 0, 0, 0);

  var all = PT.tasks({}).filter(function (t) { return t.due; });
  var byDay = {};
  all.forEach(function (t) {
    var d = new Date(t.due); d.setHours(0, 0, 0, 0);
    var k = d.getTime();
    (byDay[k] = byDay[k] || []).push(t);
  });

  var rows = '';
  for (var wk = 0; wk < 6; wk++) {
    var cells = '';
    for (var dd = 0; dd < 7; dd++) {
      var day = new Date(gridStart.getTime() + (wk * 7 + dd) * PT.DAY);
      day.setHours(0, 0, 0, 0);
      var out = day.getMonth() !== base.getMonth();
      var isToday = day.getTime() === today.getTime();
      var items = byDay[day.getTime()] || [];
      cells += '<td class="' + (out ? 'out ' : '') + (isToday ? 'today' : '') + '">' +
        '<span class="dn">' + day.getDate() + '</span>' +
        items.slice(0, 4).map(function (t) {
          var od = t.due < Date.now() && t.status !== 'done';
          return '<button class="ev ' + (t.status === 'done' ? 'done' : od ? 'od' : '') + '" type="button" data-task="' +
            t.id + '" title="' + esc(t.title) + '">' + esc(t.title) + '</button>';
        }).join('') +
        (items.length > 4 ? '<span class="dn">+' + (items.length - 4) + ' more</span>' : '') +
        '</td>';
    }
    rows += '<tr>' + cells + '</tr>';
  }

  var sel = S.selected ? PT.task(S.selected) : null;
  el.innerHTML = '<div class="sheetpage">' +
    '<div class="pagehead" style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">' +
      '<h2>' + esc(base.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })) + '</h2>' +
      '<span style="flex:1 1 auto"></span>' +
      '<button class="chip" id="cPrev" type="button">◄ Prev</button>' +
      '<button class="chip" id="cToday" type="button">Today</button>' +
      '<button class="chip" id="cNext" type="button">Next ►</button>' +
    '</div>' +
    '<table class="cal"><thead><tr>' +
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function (d) { return '<th scope="col">' + d + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="note" style="margin-top:8px">' + all.length + ' tasks have a due date · red = overdue · struck through = done</p>' +
    (sel ? '<div class="setblock" style="margin-top:16px"><h3>Selected</h3>' +
      '<p style="font-size:15px;font-weight:600">' + esc(sel.title) + '</p>' +
      '<p class="note">' + esc(PT.project(sel.projectId).name) + ' · ' + esc(sel.priority) + ' · ' +
      esc(sel.estimate) + 'h · due ' + esc(PT.relDay(sel.due)) + '</p></div>' : '') +
    '</div>';

  $('#cPrev', el).addEventListener('click', function () {
    var d = new Date(S.calMonth); d.setMonth(d.getMonth() - 1); S.calMonth = d.getTime(); vCalendar(el);
  });
  $('#cNext', el).addEventListener('click', function () {
    var d = new Date(S.calMonth); d.setMonth(d.getMonth() + 1); S.calMonth = d.getTime(); vCalendar(el);
  });
  $('#cToday', el).addEventListener('click', function () { S.calMonth = null; vCalendar(el); });
  $$('[data-task]', el).forEach(function (b) {
    b.addEventListener('click', function () { S.selected = b.dataset.task; vCalendar(el); });
  });
}

function vReports(el) {
  var s = PT.stats(), m = PT.momentum(), f = PT.forecast();
  var d = PT.diff(Date.now() - 7 * PT.DAY, Date.now());
  var name = function (id) { var t = PT.task(id); return t ? t.title : 'a removed task'; };
  var mg = morgueHTML();

  el.innerHTML = '<div class="sheetpage">' +
    '<div class="pagehead"><h2>Reports</h2><p>Everything below is computed from your own history — nothing is estimated by hand.</p></div>' +

    '<div class="statrow">' +
      '<div class="stat"><b>' + (s.todo + s.doing) + '</b><span>Open</span></div>' +
      '<div class="stat' + (s.overdue ? ' bad' : '') + '"><b>' + s.overdue + '</b><span>Overdue</span></div>' +
      '<div class="stat"><b>' + s.pct + '%</b><span>Complete</span></div>' +
      '<div class="stat"><b>' + m.perWeek + '</b><span>Tasks / week</span></div>' +
      '<div class="stat"><b>' + s.hoursLeft + 'h</b><span>Estimated left</span></div>' +
    '</div>' +

    '<div class="cols2">' +
      '<div><div class="setblock"><h3>Burndown — 30 days</h3>' + burndownSVG(30, 320, 120) + '</div></div>' +
      '<div><div class="setblock"><h3>Landing dates</h3><table class="fig"><tbody>' +
        PT.projects().map(function (p) {
          var pf = PT.forecast(p.id), ps = PT.stats(p.id);
          return '<tr><th scope="row">' + esc(p.name) + '</th><td class="' + (!isFinite(pf.days) ? 'warn' : '') + '">' +
            (pf.done ? 'complete' : !isFinite(pf.days) ? 'no pace' : PT.shortDate(pf.date.getTime()) + ' · ' + ps.total + '−' + ps.done) +
            '</td></tr>';
        }).join('') +
        '<tr><th scope="row"><b>Everything</b></th><td>' +
          (f.done ? 'complete' : !isFinite(f.days) ? 'no pace' : PT.shortDate(f.date.getTime())) + '</td></tr>' +
      '</tbody></table></div></div>' +
    '</div>' +

    '<div class="setblock"><h3>The last seven days</h3>' +
      '<p style="max-width:62ch;margin-bottom:10px">' +
        (d.net > 0 ? 'The week converged: ' + d.completed.length + ' finished against ' + d.added.length + ' added.'
         : d.net < 0 ? 'The week diverged. ' + d.added.length + ' tasks were added and only ' + d.completed.length +
                       ' finished — scope grew faster than it was worked off.'
         : 'A level week: as much added as finished.') + '</p>' +
      '<div class="cols2">' +
        ['completed', 'started', 'added'].map(function (k) {
          var label = k === 'completed' ? 'Finished' : k === 'started' ? 'Started' : 'Added';
          return '<div><div class="hd">' + label + '<span class="tally">' + d[k].length + '</span></div>' +
            (d[k].length ? d[k].map(function (id) { return '<p style="padding:3px 0;border-bottom:1px dotted var(--rule)">' + esc(name(id)) + '</p>'; }).join('')
                         : '<p class="note">Nothing.</p>') + '</div>';
        }).join('') +
      '</div></div>' +

    '<div class="setblock"><h3>Presumed lost<span class="tally"> ' + mg.n + '</span></h3>' + mg.html + '</div>' +
    '</div>';

  wireMorgue(el);
}

function vSettings(el) {
  var theme = document.documentElement.dataset.theme;
  var dens = document.documentElement.dataset.density;
  el.innerHTML = '<div class="sheetpage">' +
    '<div class="pagehead"><h2>Settings</h2><p>Prototype settings — stored in this browser only.</p></div>' +

    '<div class="setblock"><h3>Appearance</h3>' +
      '<div class="setrow"><span class="lab">Theme<small>Colour only — the type, rules and spacing do not change</small></span>' +
        '<span style="display:flex;gap:4px;flex-wrap:wrap">' +
        Object.keys(THEMES).map(function (k) {
          return '<button class="chip" data-theme="' + k + '" aria-pressed="' + (theme === k) + '">' +
            esc(THEMES[k]) + '</button>';
        }).join('') + '</span></div>' +
      '<div class="setrow"><span class="lab">Density<small>Tighter rows and a shorter header</small></span>' +
        '<span><button class="chip" data-density="comfortable" aria-pressed="' + (dens === 'comfortable') + '">Comfortable</button> ' +
        '<button class="chip" data-density="compact" aria-pressed="' + (dens === 'compact') + '">Compact</button></span></div>' +
    '</div>' +

    '<div class="setblock"><h3>Dashboard</h3>' +
      '<div class="setrow"><span class="lab">Layout mode<small>Loose sheets, or a locked page</small></span>' +
        '<span class="note">' + esc(S.mode) + '</span></div>' +
      '<div class="setrow"><span class="lab">Open panels<small>Set them from the strip under the dashboard</small></span>' +
        '<span class="note">' + esc(S.open.map(function (i) { return P[i].title; }).join(', ') || 'none') + '</span></div>' +
      '<div class="setrow"><span class="lab">Reset the layout<small>Back to the Morning arrangement</small></span>' +
        '<button class="chip" id="s-layout" type="button">Reset layout</button></div>' +
    '</div>' +

    '<div class="setblock"><h3>Data</h3>' +
      '<div class="setrow"><span class="lab">Seed dataset<small>4 projects, 34 tasks, five weeks of history</small></span>' +
        '<button class="chip red" id="s-reset" type="button">Reset all data</button></div>' +
      '<div class="setrow"><span class="lab">Storage<small>localStorage · shared with every variant in the lab</small></span>' +
        '<span class="note">pt-lab-v2</span></div>' +
    '</div>' +

    '<div class="setblock"><h3>About</h3>' +
      '<p style="max-width:64ch">A prototype dashboard for Project Tracker: the real app\'s sidebar and navigation, ' +
      'with a dual-mode board in place of the stat cards. No network requests, no dependencies. ' +
      '<a href="./index.html">Back to the lab</a>.</p></div>' +
    '</div>';

  $$('[data-theme]', el).forEach(function (b) {
    b.addEventListener('click', function () { setTheme(b.dataset.theme); vSettings(el); });
  });
  $$('[data-density]', el).forEach(function (b) {
    b.addEventListener('click', function () {
      document.documentElement.dataset.density = b.dataset.density;
      try { localStorage.setItem(KEY + '-density', b.dataset.density); } catch (e) {}
      vSettings(el); afterResize();
    });
  });
  $('#s-layout', el).addEventListener('click', function () {
    setMode('loose', true); applyPreset('morning'); say('Layout reset');
  });
  $('#s-reset', el).addEventListener('click', function () {
    PT.reset(); S.project = PT.projects()[0] ? PT.projects()[0].id : null; S.selected = null;
    projects(); vSettings(el); say('Data reset');
  });
}

/* ==========================================================================
   THEME + ARRANGEMENTS + CHROME
   ========================================================================== */
var THEMES = {
  paper:     'Paper',
  newsprint: 'Newsprint',
  original:  'Original',
  blueprint: 'Blueprint',
  terminal:  'Terminal',
};

function setTheme(t) {
  if (!THEMES[t]) t = 'paper';
  document.documentElement.dataset.theme = t;
  var r = $('#t-' + t); if (r) r.checked = true;
  try { localStorage.setItem(KEY + '-theme', t); } catch (e) {}
  // Settings shows the same choice as a row of buttons; keep the two in step
  // when the change came from the swatches in the top bar.
  if (S.view === 'settings') renderView();
  say(THEMES[t] + ' theme');
}
$$('#themeRadio input').forEach(function (r) {
  r.addEventListener('change', function () { if (r.checked) setTheme(r.value); });
});

function presets() {
  var o = {}, base = PRESETS[S.mode], custom = S.custom[S.mode] || {};
  Object.keys(base).forEach(function (k) { o[k] = base[k]; });
  Object.keys(custom).forEach(function (k) { o[k] = custom[k]; });
  return o;
}

function applyPreset(key) {
  var pr = presets()[key];
  if (!pr) return;
  S.arrangement = key;
  if (S.mode === 'loose') {
    S.open = pr.open.slice();
    S.open.forEach(function (id) {
      var g = pr.geo && pr.geo[id];
      S.wins[id] = g
        ? { fx: g[0], fy: g[1], fw: g[2], fh: g[3], z: ++zTop, min: false }
        : defaultGeo(id);
    });
  } else {
    S.layout = clone(pr.tree);
    S.open = leaves(S.layout).map(function (l) { return l.leaf; });
  }
  renderBoard(); rail(); save();
  say(pr.name);
}

function rail() {
  var all = presets();
  $('#rail').innerHTML = Object.keys(all).map(function (k) {
    return '<button class="chip" type="button" data-arr="' + esc(k) + '" aria-pressed="' +
      (S.arrangement === k ? 'true' : 'false') + '">' + esc(all[k].name) + '</button>';
  }).join('');
  $$('#rail [data-arr]').forEach(function (b) {
    b.addEventListener('click', function () { applyPreset(b.dataset.arr); });
    b.addEventListener('contextmenu', function (e) {
      if (!(S.custom[S.mode] || {})[b.dataset.arr]) return;
      e.preventDefault();
      delete S.custom[S.mode][b.dataset.arr];
      if (S.arrangement === b.dataset.arr) S.arrangement = null;
      rail(); save(); say('Arrangement removed');
    });
  });
}

$('#saveArr').addEventListener('click', function () {
  var name = window.prompt('Name this arrangement (saved under ' + S.mode.toUpperCase() + ')');
  if (!name || !name.trim()) return;
  var key = 'u_' + name.trim().toLowerCase().replace(/\W+/g, '_');
  if (S.mode === 'loose') {
    var geo = {};
    S.open.forEach(function (id) {
      var w = S.wins[id];
      geo[id] = [w.fx, w.fy, w.fw, w.fh];
    });
    S.custom.loose[key] = { name: name.trim(), open: S.open.slice(), geo: geo };
  } else {
    S.custom.locked[key] = { name: name.trim(), tree: clone(S.layout) };
  }
  S.arrangement = key;
  rail(); save();
  say('Saved ' + name.trim() + '. Right-click a saved arrangement to remove it.');
});

function syncStick() {
  var st = $('#stick');
  if (!st.childElementCount) {
    st.innerHTML = Object.keys(P).map(function (id) {
      return '<button class="slug" type="button" data-slug="' + id + '"><span class="mark"></span>' + esc(P[id].title) + '</button>';
    }).join('') + '<span style="flex:1 1 auto"></span><span class="note" id="stickHint"></span>';
    $$('[data-slug]', st).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.slug;
        if (S.open.indexOf(id) >= 0 && !(S.wins[id] && S.wins[id].min)) lift(id);
        else setIn(id);
      });
    });
  }
  $$('[data-slug]', st).forEach(function (b) {
    var id = b.dataset.slug;
    b.dataset.open = (S.open.indexOf(id) >= 0 && !(S.mode === 'loose' && S.wins[id] && S.wins[id].min)) ? '1' : '0';
  });
  $('#stickHint').textContent = (S.mode === 'loose'
    ? 'Drag edges or corners to resize · Alt+← → snap · Alt+↓ minimise'
    : 'Drag a panel head onto another to swap · Alt+arrows · pull a gutter to resize')
    + ' · Alt+Z toggles the layout';
}

function projects() {
  var ps = PT.projects();
  if (!ps.length) S.project = null;
  else if (!PT.project(S.project)) S.project = ps[0].id;
  $('#projSel').innerHTML = ps.map(function (p) {
    return '<option value="' + p.id + '"' + (p.id === S.project ? ' selected' : '') + '>' + esc(p.name) + '</option>';
  }).join('');
  conditions(); nav(); paintAll(); renderView();
}

function conditions() {
  var ps = PT.projects();
  if (!ps.length) { $('#cond').textContent = 'No projects'; return; }
  var avg = ps.reduce(function (a, p) { return a + PT.health(p.id); }, 0) / ps.length;
  var word = avg > .72 ? 'Clear' : avg > .55 ? 'Fair' : avg > .42 ? 'Unsettled' : 'Heavy weather';
  var s = PT.stats();
  $('#cond').textContent = word + ' · ' + s.overdue + ' overdue · ' + s.hoursLeft + 'h left';
}

$('#projSel').addEventListener('change', function () {
  S.project = this.value; S.selected = null; paintAll(); renderView(); nav(); save();
});

addEventListener('keydown', function (e) {
  var ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (!S.selected) return;
  var t = PT.task(S.selected); if (!t) return;
  var order = ['todo', 'doing', 'done'], i = order.indexOf(t.status);
  if (e.key === ']') { e.preventDefault(); PT.moveTask(t.id, order[Math.min(2, i + 1)]); }
  else if (e.key === '[') { e.preventDefault(); PT.moveTask(t.id, order[Math.max(0, i - 1)]); }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault(); PT.removeTask(t.id); S.selected = null; say('Deleted ' + t.title);
  }
});

/* ==========================================================================
   PERSISTENCE + BOOT
   ========================================================================== */
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      view: S.view, side: S.side, mode: S.mode, open: S.open, wins: S.wins,
      layout: S.layout, custom: S.custom, project: S.project, arrangement: S.arrangement,
    }));
  } catch (e) { /* private mode — the arrangement just won't survive a reload */ }
}

function validTree(n) {
  if (!n || typeof n !== 'object') return false;
  if (n.leaf) return !!P[n.leaf];
  return (n.dir === 'row' || n.dir === 'col') && typeof n.ratio === 'number' &&
         validTree(n.a) && validTree(n.b);
}

function load() {
  try {
    var raw = localStorage.getItem(KEY); if (!raw) return false;
    var s = JSON.parse(raw); if (!s || !s.open || !s.open.length) return false;
    S.open = s.open.filter(function (id) { return !!P[id]; });
    if (!S.open.length) return false;
    S.mode = s.mode === 'locked' ? 'locked' : 'loose';
    S.view = VIEWS[s.view] ? s.view : 'dashboard';
    S.side = !!s.side;
    S.wins = s.wins || {};
    S.custom = s.custom && s.custom.loose ? s.custom : { loose: {}, locked: {} };
    S.arrangement = s.arrangement || null;
    if (s.project && PT.project(s.project)) S.project = s.project;
    if (s.layout) {
      // Drop any leaf this build no longer knows about, then check what is left
      // is still a well-formed tree.
      var pruned = s.layout;
      leaves(pruned).forEach(function (l) { if (!P[l.leaf]) pruned = dropLeaf(pruned, l.leaf); });
      if (validTree(pruned)) S.layout = pruned;
    }
    Object.keys(S.wins).forEach(function (id) { zTop = Math.max(zTop, S.wins[id].z || 0); });
    return true;
  } catch (e) { return false; }
}

/* Because geometry is fractional, a board resize is just a re-apply. */
function afterResize() {
  if (S.view !== 'dashboard') return;
  var R = boardRect();
  if (!R.width || !R.height) return;
  if (S.mode === 'loose' && !narrow()) S.open.forEach(applyGeo);
  else renderBoard();
}

/* Watch the board itself. A ResizeObserver catches every cause of a size
   change — window resize, the sidebar's width transition, a density switch —
   without anyone having to predict which one happened or how long it takes.
   Debounced, so a running transition settles into a single recalculation. */
var rt = 0;
function scheduleResize() { clearTimeout(rt); rt = setTimeout(afterResize, 90); }

if (window.ResizeObserver) {
  new ResizeObserver(scheduleResize).observe(board);
} else {
  addEventListener('resize', scheduleResize);
}

PT.on('change', function () { conditions(); nav(); paintAll(); renderView(); });

try {
  var th = localStorage.getItem(KEY + '-theme');
  // Earlier builds stored a light/night pair; carry those over.
  if (th === 'light') th = 'paper';
  if (th === 'night') th = 'newsprint';
  if (THEMES[th]) setTheme(th);
  var de = localStorage.getItem(KEY + '-density');
  if (de === 'compact' || de === 'comfortable') document.documentElement.dataset.density = de;
} catch (e) {}

var restored = load();
if (!restored) { S.mode = 'loose'; S.arrangement = 'morning'; S.view = 'dashboard'; }
document.body.dataset.mode = S.mode;
var mr = $('#m-' + S.mode); if (mr) mr.checked = true;
setSide(S.side);

projects();
setView(S.view);
if (!restored || !Object.keys(S.wins).length) applyPreset('morning');
else { renderBoard(); rail(); }
if (S.mode === 'loose' && S.open[0]) focusSheet(S.open[0]);
})();
</script>
