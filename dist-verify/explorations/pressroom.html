<!doctype html>
<html lang="en" data-edition="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRESS ROOM — Project Tracker Lab</title>
<meta name="color-scheme" content="light dark">
<style>
/* ===========================================================================
   PRESS ROOM — direction 06
   WORKBENCH's window manager wearing BROADSHEET's clothes.

   A paste-up board: loose sheets of paper on a light table, moved and squared
   up by hand. Free geometry, overlap allowed, snap to the edges.

   The house rules from BROADSHEET still hold — no blurred shadows, no
   gradients on content, no border-radius. Floating sheets still need depth, so
   depth comes from a hard offset block, the way mis-registered ink does. That
   is print's own answer to the problem and it costs no blur.
   =========================================================================== */
:root {
  --paper: #f7f4ec;
  --paper-2: #efeade;
  --paper-3: #e6e1d4;
  --table: #ddd7c7;
  --ink: #14110c;
  --ink-2: #4a453b;
  --ink-3: #7d7668;
  --red: #a4291f;
  --rule: #cfc7b8;
  --offset: rgba(20, 17, 12, 0.16);

  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Times New Roman', serif;
  --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --u: 4px;
  --bar: 34px;
  --dock: 44px;
  --fast: 110ms;
  --mid: 190ms;
  --ease: cubic-bezier(0.2, 0.8, 0.3, 1);
}

[data-edition='dusk'] {
  --paper: #16150f;
  --paper-2: #1e1c15;
  --paper-3: #24211a;
  --table: #0e0d09;
  --ink: #e8e3d5;
  --ink-2: #b3ab99;
  --ink-3: #837c6c;
  --red: #e0705f;
  --rule: #3a3629;
  --offset: rgba(0, 0, 0, 0.5);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--table); color: var(--ink);
  font: 14px/1.45 var(--serif);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.1; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* The light table: paste-up board with a faint square-up grid. */
#table {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to right, rgba(20,17,12,.045) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(to bottom, rgba(20,17,12,.045) 0 1px, transparent 1px 48px),
    var(--table);
}
[data-edition='dusk'] #table {
  background:
    repeating-linear-gradient(to right, rgba(255,255,255,.035) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 48px),
    var(--table);
}
#grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .05; mix-blend-mode: multiply; }
[data-edition='dusk'] #grain { mix-blend-mode: screen; opacity: .035; }

/* ---------- the standing head (menu bar) ---------- */
#head {
  position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 60;
  display: flex; align-items: center; gap: calc(var(--u) * 2);
  padding: 0 calc(var(--u) * 2);
  background: var(--paper); border-bottom: 2px solid var(--ink);
  font-family: var(--mono); font-size: 11px;
}
#head .flag {
  font-family: var(--serif); font-weight: 700; font-size: 15px;
  letter-spacing: .02em; text-transform: uppercase;
  padding-right: calc(var(--u) * 2); border-right: 1px solid var(--rule);
  white-space: nowrap;
}
#head .sp { flex: 1 1 auto; }
#head select {
  background: transparent; border: 1px solid var(--rule); border-radius: 0;
  padding: 3px 5px; font-family: var(--mono); font-size: 11px; min-height: 26px;
}
#head select:focus { border-color: var(--red); outline: none; }
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--rule); border-radius: 0;
  padding: 5px 8px; min-height: 26px; cursor: pointer; color: var(--ink-2);
  transition: background var(--fast) linear, color var(--fast) linear;
  white-space: nowrap;
}
.chip:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-pressed='true'] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.red { color: var(--red); border-color: var(--red); }
.chip.red:hover { background: var(--red); color: var(--paper); }
.editions { display: flex; gap: var(--u); align-items: center; }
.cond { color: var(--ink-3); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }

/* ---------- the board (desktop) ---------- */
#board { position: fixed; inset: var(--bar) 0 var(--dock) 0; z-index: 10; }

/* ---------- sheets (windows) ---------- */
.sheet {
  position: absolute; display: flex; flex-direction: column;
  min-width: 260px; min-height: 130px;
  background: var(--paper);
  border: 1px solid var(--ink);
  /* Hard offset, no blur — mis-registration, not a drop shadow. */
  box-shadow: 3px 3px 0 var(--offset);
  overflow: hidden;
}
.sheet.animating { transition: transform var(--mid) var(--ease), width var(--mid) var(--ease), height var(--mid) var(--ease); }
.sheet[data-min='1'] { display: none; }
.sheet.focused { box-shadow: 3px 3px 0 var(--offset), inset 0 2px 0 var(--red); }

.folio {
  flex: 0 0 auto; height: 26px; display: flex; align-items: center; gap: var(--u);
  padding: 0 var(--u) 0 calc(var(--u) * 2);
  background: var(--paper-2); border-bottom: 1px solid var(--ink);
  cursor: grab; user-select: none;
}
.folio:active { cursor: grabbing; }
.folio h2 {
  font-family: var(--sans); font-size: 9px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.folio .sp { flex: 1 1 auto; }
.folio button {
  width: 20px; height: 20px; display: grid; place-items: center;
  background: transparent; border: 0; cursor: pointer;
  font-family: var(--mono); font-size: 11px; line-height: 1; color: var(--ink-3);
}
.folio button:hover { background: var(--ink); color: var(--paper); }
.folio button.x:hover { background: var(--red); color: var(--paper); }

.copy { flex: 1 1 auto; overflow: auto; padding: calc(var(--u) * 2.5); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.copy::-webkit-scrollbar { width: 9px; height: 9px; }
.copy::-webkit-scrollbar-thumb { background: var(--rule); }

.rz { position: absolute; z-index: 3; }
.rz.e { top: 6px; bottom: 6px; right: -3px; width: 8px; cursor: ew-resize; }
.rz.s { left: 6px; right: 6px; bottom: -3px; height: 8px; cursor: ns-resize; }
.rz.w { top: 6px; bottom: 6px; left: -3px; width: 8px; cursor: ew-resize; }
.rz.n { left: 6px; right: 6px; top: -3px; height: 8px; cursor: ns-resize; }
.rz.se { right: -3px; bottom: -3px; width: 14px; height: 14px; cursor: nwse-resize; }

/* Snap preview drawn as crop marks rather than a filled rectangle. */
#ghost {
  position: absolute; z-index: 5; pointer-events: none; opacity: 0;
  border: 1px dashed var(--red); background: rgba(164, 41, 31, .06);
  transition: opacity var(--fast) linear, transform var(--fast) var(--ease),
              width var(--fast) var(--ease), height var(--fast) var(--ease);
}

/* ---------- the composing stick (dock) ---------- */
#stick {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--dock); z-index: 60;
  display: flex; align-items: center; gap: var(--u);
  padding: 0 calc(var(--u) * 2);
  background: var(--paper); border-top: 2px solid var(--ink);
  overflow-x: auto;
}
.slug {
  display: flex; align-items: center; gap: calc(var(--u) * 1.5);
  height: 28px; padding: 0 calc(var(--u) * 2);
  background: transparent; border: 1px solid var(--rule); border-radius: 0;
  font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); cursor: pointer; white-space: nowrap;
  transition: color var(--fast) linear, border-color var(--fast) linear;
}
.slug:hover { color: var(--ink); border-color: var(--ink); }
.slug[data-open='1'] { color: var(--ink); border-color: var(--ink); background: var(--paper-2); }
.slug .mark { width: 6px; height: 6px; background: var(--rule); }
.slug[data-open='1'] .mark { background: var(--red); }

/* ---------- panel typography ---------- */
.hd {
  font-family: var(--sans); font-size: 9px; font-weight: 700;
  letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
}
.hd .tally { font-family: var(--mono); font-weight: 400; letter-spacing: .04em; }

table.fig { width: 100%; border-collapse: collapse; font-size: 13px; }
table.fig th { text-align: left; font-weight: 400; color: var(--ink-2); padding: 3px 0; }
table.fig td { text-align: right; padding: 3px 0; font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; }
table.fig tr { border-bottom: 1px dotted var(--rule); }
table.fig tr:last-child { border-bottom: 0; }
table.fig td.warn { color: var(--red); }

/* ---------- galley (board) ---------- */
.galley { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 2.5); min-height: 100%; }
.gcol { display: flex; flex-direction: column; min-width: 0; }
.gdrop { flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; min-height: 40px; padding: 2px; }
.gdrop.over { background: rgba(164, 41, 31, .07); outline: 1px dashed var(--red); }

.cut {
  display: block; width: 100%; text-align: left;
  background: var(--paper); border: 0; border-top: 1px solid var(--rule);
  padding: 6px 4px 7px; cursor: grab; color: var(--ink);
}
.cut:first-child { border-top: 0; }
.cut:hover { background: var(--paper-2); }
.cut.sel { background: var(--paper-2); border-left: 2px solid var(--red); padding-left: 6px; }
.cut.overdue { border-left: 2px solid var(--red); padding-left: 6px; }
.cut.dragging { opacity: .35; }
/* Both are <span> so the whole cutting can be one <button>; without an
   explicit block they run together on a single line. */
.cut .t { display: block; font-size: 13.5px; line-height: 1.25; font-weight: 600; }
.cut.done .t { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.cut .d { display: block; margin-top: 3px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: .02em; }
.cut .d .od { color: var(--red); font-weight: 700; }

/* ---------- forms ---------- */
.fld { margin-bottom: 9px; }
.fld label { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.fld input, .fld select, .fld textarea {
  width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--ink);
  border-radius: 0; padding: 5px 0; min-height: 32px; font-family: var(--serif); font-size: 13.5px;
}
.fld textarea { resize: vertical; min-height: 54px; }
.fld select { font-family: var(--mono); font-size: 11.5px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-bottom-color: var(--red); }
.parse { font-family: var(--mono); font-size: 10px; color: var(--ink-3); border-top: 1px dotted var(--rule); padding-top: 6px; margin-top: 4px; min-height: 2.6em; }
.parse b { color: var(--ink); }
.note { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }

/* ---------- morgue ---------- */
.tomb { padding: 6px 0; border-bottom: 1px dotted var(--rule); }
.tomb:last-child { border-bottom: 0; }
.tomb h4 { font-size: 13px; font-style: italic; font-weight: 600; }
.tomb p { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.tomb .acts { margin-top: 5px; display: flex; gap: 4px; }
.tomb .chip { font-size: 9px; padding: 4px 6px; min-height: 24px; }

svg.plot { width: 100%; height: auto; display: block; overflow: visible; }
svg.plot text { font-family: var(--mono); font-size: 7px; fill: var(--ink-3); }
svg.plot text.lbl { fill: var(--ink); font-weight: 700; }

/* ---------- narrow: the paste-up board becomes a single page ---------- */
#tabs { display: none; }
@media (max-width: 900px) {
  #board { inset: calc(var(--bar) + 30px) 0 var(--dock) 0; overflow-y: auto; }
  #tabs {
    display: flex; gap: var(--u); position: fixed; top: var(--bar); left: 0; right: 0; height: 30px;
    z-index: 55; padding: 0 calc(var(--u) * 2); align-items: center; overflow-x: auto;
    background: var(--paper-2); border-bottom: 1px solid var(--ink);
  }
  .sheet {
    position: static !important; width: auto !important; height: auto !important;
    transform: none !important; margin: calc(var(--u) * 2); min-height: 200px; box-shadow: 3px 3px 0 var(--offset);
  }
  .sheet:not(.tabon) { display: none; }
  .sheet .rz, .folio button.mx { display: none; }
  .folio { cursor: default; }
  .galley { grid-template-columns: 1fr; gap: 14px; }
  #head .editions { display: none; }
}

@media print {
  #table, #grain, #head, #stick, #tabs, .rz, .folio button { display: none !important; }
  .sheet { position: static !important; width: auto !important; height: auto !important; transform: none !important;
           box-shadow: none; border: 1px solid #000; margin: 0 0 12pt; break-inside: avoid; }
  body { overflow: visible; background: #fff; }
  #board { position: static; inset: auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

.lab-back { color: var(--ink-3); text-decoration: none; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
.lab-back:hover { color: var(--ink); }
</style>
</head>
<body>

<div id="table"></div>
<svg id="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#gr)"/>
</svg>

<div id="head">
  <span class="flag">Press Room</span>
  <label class="sr-only" for="projSel">Active desk</label>
  <select id="projSel"></select>
  <span class="editions" id="editions" role="group" aria-label="Editions"></span>
  <button class="chip" id="saveEd" type="button">＋ Save</button>
  <span class="sp"></span>
  <span class="cond" id="cond">—</span>
  <button class="chip" id="dusk" type="button" aria-pressed="false">Dusk</button>
  <a class="lab-back" href="./index.html">Lab</a>
</div>

<div id="tabs" role="tablist" aria-label="Sheets"></div>

<div id="board"><div id="ghost" aria-hidden="true"></div></div>

<div id="stick" role="toolbar" aria-label="Open a sheet"></div>

<p class="sr-only" role="status" aria-live="polite" id="live"></p>

<script src="_kernel.js"></script>
<script>
(function () {
'use strict';

var $  = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var board = $('#board'), ghost = $('#ghost'), live = $('#live');
var REDUCED = PT.reducedMotion();
var KEY = 'pt-pressroom-layout';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function say(m) { live.textContent = m; }
function narrow() { return window.innerWidth <= 900; }

var S = { project: null, selected: null, wins: {}, edition: 'morning', custom: {}, tab: 'galley' };
var zTop = 20;

/* Panels keep BROADSHEET's vocabulary — a galley is a column proof, the morgue
   is where a newspaper files what it is no longer running. */
var P = {
  galley:   { title: 'Galley',    w: 620, h: 400, x: 24,  y: 18,  render: rGalley },
  schedule: { title: 'Schedule',  w: 640, h: 280, x: 24,  y: 436, render: rSchedule },
  ledger:   { title: 'Ledger',    w: 330, h: 400, x: 668, y: 18,  render: rLedger },
  copydesk: { title: 'Copy Desk', w: 330, h: 430, x: 1010, y: 18, render: rCopyDesk },
  wire:     { title: 'Wire',      w: 400, h: 190, x: 680, y: 436, render: rWire },
  morgue:   { title: 'Morgue',    w: 330, h: 300, x: 1010, y: 462, render: rMorgue },
};

/* Preset geometry is stored as FRACTIONS of the board, not pixels. Fixed
   pixels only ever fill one screen size — on anything wider the edition left a
   third of the table bare, which for a layout that is pretending to be a
   printed page is exactly the wrong impression. Resolved against the real
   board rect when an edition is applied. */
var EDITIONS = {
  morning: { name: 'Morning', open: ['ledger', 'galley', 'wire', 'morgue'],
             geo: { ledger:   [0,     0,    0.25,  0.53],
                    galley:   [0.255, 0,    0.745, 0.53],
                    wire:     [0,     0.54, 0.49,  0.46],
                    morgue:   [0.495, 0.54, 0.505, 0.46] } },
  copy:    { name: 'Copy Desk', open: ['galley', 'copydesk'],
             geo: { galley:   [0,     0,    0.70,  1],
                    copydesk: [0.705, 0,    0.295, 1] } },
  press:   { name: 'Press Check', open: ['schedule', 'ledger', 'morgue'],
             geo: { schedule: [0,     0,    1,     0.42],
                    ledger:   [0,     0.43, 0.49,  0.57],
                    morgue:   [0.495, 0.43, 0.505, 0.57] } },
};

/** Fractions -> pixels. Custom editions are saved in pixels, so anything
    already outside 0..1 is passed straight through. */
function resolveGeo(g) {
  if (!g) return null;
  var isFraction = g[2] <= 1 && g[3] <= 1;
  if (!isFraction) return g;
  var R = board.getBoundingClientRect();
  return [g[0] * R.width, g[1] * R.height, g[2] * R.width, g[3] * R.height];
}

/* ==========================================================================
   SHEET MANAGER — same mechanics as WORKBENCH, dressed as paper
   ========================================================================== */
function el(id) { return document.getElementById('sh-' + id); }
function openIds() { return Object.keys(S.wins).filter(function (k) { return S.wins[k].open; }); }

function open(id, geo) {
  var d = P[id]; if (!d) return;
  var w = S.wins[id];
  if (!w) w = S.wins[id] = { open: true, x: d.x, y: d.y, w: d.w, h: d.h, min: false, z: ++zTop };
  w.open = true; w.min = false; w.z = ++zTop;
  if (geo) { w.x = geo[0]; w.y = geo[1]; w.w = geo[2]; w.h = geo[3]; }

  var e = el(id);
  if (!e) {
    e = document.createElement('section');
    e.className = 'sheet'; e.id = 'sh-' + id; e.tabIndex = -1;
    e.setAttribute('role', 'region'); e.setAttribute('aria-label', d.title + ' sheet');
    e.innerHTML =
      '<header class="folio"><h2>' + esc(d.title) + '</h2><span class="sp"></span>' +
        '<button type="button" class="mn" aria-label="Set aside ' + esc(d.title) + '">–</button>' +
        '<button type="button" class="mx" aria-label="Full page ' + esc(d.title) + '">□</button>' +
        '<button type="button" class="x" aria-label="Spike ' + esc(d.title) + '">✕</button>' +
      '</header><div class="copy" id="cp-' + id + '"></div>' +
      '<span class="rz n"></span><span class="rz s"></span><span class="rz e"></span>' +
      '<span class="rz w"></span><span class="rz se"></span>';
    board.appendChild(e);
    wire(id, e);
  }
  geoApply(id); paint(id); syncStick();
  return e;
}

function close(id) {
  if (S.wins[id]) S.wins[id].open = false;
  var e = el(id); if (e) e.remove();
  if (S.tab === id) { var f = openIds()[0]; if (f) S.tab = f; }
  syncStick(); save(); tabs();
}

function geoApply(id) {
  var w = S.wins[id], e = el(id);
  if (!w || !e) return;
  if (narrow()) { e.style.transform = ''; e.style.width = ''; e.style.height = ''; return; }
  e.style.transform = 'translate3d(' + Math.round(w.x) + 'px,' + Math.round(w.y) + 'px,0)';
  e.style.width = Math.round(w.w) + 'px';
  e.style.height = Math.round(w.h) + 'px';
  e.style.zIndex = w.z;
  e.dataset.min = w.min ? '1' : '0';
}

function focus(id) {
  var w = S.wins[id]; if (!w) return;
  w.z = ++zTop; geoApply(id);
  $$('.sheet').forEach(function (x) { x.classList.remove('focused'); });
  var e = el(id); if (e) e.classList.add('focused');
}

function clampW(w) {
  var R = board.getBoundingClientRect();
  w.w = PT.clamp(w.w, 260, R.width);
  w.h = PT.clamp(w.h, 130, R.height);
  w.x = PT.clamp(w.x, -(w.w - 90), R.width - 90);
  w.y = PT.clamp(w.y, 0, R.height - 26);
}

function wire(id, e) {
  var folio = $('.folio', e);
  e.addEventListener('pointerdown', function () { focus(id); }, true);

  $('.x', e).addEventListener('click', function (ev) { ev.stopPropagation(); close(id); });
  $('.mn', e).addEventListener('click', function (ev) {
    ev.stopPropagation(); S.wins[id].min = true; geoApply(id); syncStick(); save();
    say(P[id].title + ' set aside');
  });
  $('.mx', e).addEventListener('click', function (ev) {
    ev.stopPropagation();
    var w = S.wins[id], R = board.getBoundingClientRect();
    if (w._r) { w.x = w._r[0]; w.y = w._r[1]; w.w = w._r[2]; w.h = w._r[3]; w._r = null; }
    else { w._r = [w.x, w.y, w.w, w.h]; w.x = 0; w.y = 0; w.w = R.width; w.h = R.height; }
    geoApply(id); save();
  });

  var drag = null;
  folio.addEventListener('pointerdown', function (ev) {
    if (narrow() || ev.target.closest('button')) return;
    var w = S.wins[id];
    drag = { px: ev.clientX, py: ev.clientY, ox: w.x, oy: w.y, snap: null };
    folio.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  folio.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var w = S.wins[id], R = board.getBoundingClientRect();
    w.x = drag.ox + (ev.clientX - drag.px);
    w.y = drag.oy + (ev.clientY - drag.py);
    clampW(w); geoApply(id);

    var lx = ev.clientX - R.left, ly = ev.clientY - R.top, T = 28, s = null;
    if (ly < T) s = [0, 0, R.width, R.height];
    else if (lx < T) s = [0, 0, R.width / 2, R.height];
    else if (lx > R.width - T) s = [R.width / 2, 0, R.width / 2, R.height];
    drag.snap = s;
    if (s) {
      ghost.style.opacity = '1';
      ghost.style.transform = 'translate3d(' + s[0] + 'px,' + s[1] + 'px,0)';
      ghost.style.width = s[2] + 'px'; ghost.style.height = s[3] + 'px';
    } else ghost.style.opacity = '0';
  });
  function endDrag(ev) {
    if (!drag) return;
    if (drag.snap) {
      var w = S.wins[id];
      w.x = drag.snap[0]; w.y = drag.snap[1]; w.w = drag.snap[2]; w.h = drag.snap[3];
      geoApply(id);
    }
    ghost.style.opacity = '0'; drag = null; save();
    if (ev && ev.pointerId != null) { try { folio.releasePointerCapture(ev.pointerId); } catch (x) {} }
  }
  folio.addEventListener('pointerup', endDrag);
  folio.addEventListener('pointercancel', endDrag);

  $$('.rz', e).forEach(function (h) {
    var dir = h.className.replace('rz ', '').trim(), rs = null;
    h.addEventListener('pointerdown', function (ev) {
      if (narrow()) return;
      var w = S.wins[id];
      rs = { px: ev.clientX, py: ev.clientY, ox: w.x, oy: w.y, ow: w.w, oh: w.h };
      h.setPointerCapture(ev.pointerId); ev.preventDefault(); ev.stopPropagation();
    });
    h.addEventListener('pointermove', function (ev) {
      if (!rs) return;
      var w = S.wins[id], dx = ev.clientX - rs.px, dy = ev.clientY - rs.py;
      if (dir.indexOf('e') >= 0) w.w = rs.ow + dx;
      if (dir.indexOf('s') >= 0) w.h = rs.oh + dy;
      if (dir.indexOf('w') >= 0) { w.w = rs.ow - dx; w.x = rs.ox + dx; }
      if (dir.indexOf('n') >= 0) { w.h = rs.oh - dy; w.y = rs.oy + dy; }
      clampW(w); geoApply(id);
    });
    function endRz(ev) {
      if (!rs) return;
      rs = null; save(); paint(id);
      if (ev && ev.pointerId != null) { try { h.releasePointerCapture(ev.pointerId); } catch (x) {} }
    }
    h.addEventListener('pointerup', endRz);
    h.addEventListener('pointercancel', endRz);
  });

  e.addEventListener('keydown', function (ev) {
    if (!ev.altKey || narrow()) return;
    var w = S.wins[id], R = board.getBoundingClientRect(), did = true;
    if (ev.key === 'ArrowLeft')       { w.x = 0; w.y = 0; w.w = R.width / 2; w.h = R.height; }
    else if (ev.key === 'ArrowRight') { w.x = R.width / 2; w.y = 0; w.w = R.width / 2; w.h = R.height; }
    else if (ev.key === 'ArrowUp')    { w.x = 0; w.y = 0; w.w = R.width; w.h = R.height; }
    else if (ev.key === 'ArrowDown')  { w.min = true; syncStick(); }
    else did = false;
    if (did) { ev.preventDefault(); geoApply(id); save(); say(P[id].title + ' squared up'); }
  });
}

function paint(id) {

}
function paintAll() { openIds().forEach(paint); }

var COLS = [{ id: 'todo', name: 'Standing' }, { id: 'doing', name: 'On the stone' }, { id: 'done', name: 'Printed' }];

function rGalley(c) {

  c.innerHTML = '<div class="galley">' + COLS.map(function (col) {
    var items = ts.filter(function (t) { return t.status === col.id; });

          '<span class="t">' + esc(t.title) + '</span>' +

      }).join('') + '</div></div>';
  }).join('') + '</div>' +

function sel(id) { S.selected = id; paintAll(); var t = PT.task(id); if (t) say('Selected ' + t.title); }

function rSchedule(c) {
  var ts = PT.tasks({ project: S.project });
  if (!ts.length) { c.innerHTML = '<p class="note">Nothing scheduled.</p>'; return; }
  var now = Date.now();
  var t0 = Math.min.apply(null, ts.map(function (t) { return t.createdAt; }).concat([now - 3 * PT.DAY]));
  var t1 = Math.max.apply(null, ts.map(function (t) { return t.due || t.doneAt || t.createdAt + 6 * PT.DAY; }).concat([now + 7 * PT.DAY]));
  var span = Math.max(1, t1 - t0), W = 900, ROW = 19, H = ts.length * ROW + 24;
  var x = function (ts_) { return ((ts_ - t0) / span) * (W - 210) + 200; };

  var grid = '', d = new Date(t0); d.setHours(0, 0, 0, 0);
  while (d.getTime() < t1) {
    var gx = x(d.getTime());
    if (gx > 198) grid += '<line x1="' + gx.toFixed(1) + '" x2="' + gx.toFixed(1) + '" y1="14" y2="' + (H - 4) +
      '" stroke="var(--rule)" stroke-width="0.5"/><text x="' + gx.toFixed(1) + '" y="9">' + esc(PT.shortDate(d.getTime())) + '</text>';
    d = new Date(d.getTime() + 7 * PT.DAY);
  }

  var bars = ts.map(function (t, i) {
    var y = 20 + i * ROW, a = x(t.createdAt);
    var b = x(t.due || t.doneAt || t.createdAt + (t.estimate || 2) * 3 * PT.DAY);
    var od = t.due && t.due < now && t.status !== 'done';
    // Print has no colour to spare: status is hatching and weight, not hue.
    var fill = t.status === 'done' ? 'var(--rule)' : od ? 'var(--red)' : 'var(--ink)';
    var op = t.status === 'todo' ? 0.42 : 1;
    var label = t.title.length > 32 ? t.title.slice(0, 31) + '…' : t.title;
    return '<g class="grow" data-task="' + t.id + '" style="cursor:pointer">' +
      '<rect x="0" y="' + (y - 7) + '" width="' + W + '" height="' + (ROW - 2) + '" fill="' +
        (S.selected === t.id ? 'rgba(164,41,31,.09)' : 'transparent') + '"/>' +
      '<text x="2" y="' + (y + 3) + '" fill="var(--ink-2)" font-family="' +
        (S.selected === t.id ? 'inherit' : 'inherit') + '" font-size="9">' + esc(label) + '</text>' +
      '<rect x="' + Math.min(a, b).toFixed(1) + '" y="' + (y - 3) + '" width="' +
        Math.max(3, Math.abs(b - a)).toFixed(1) + '" height="7" fill="' + fill + '" opacity="' + op + '"/></g>';
  }).join('');

  var nx = x(now);
  c.innerHTML = '<div class="hd">Production schedule<span class="tally">' + ts.length + '</span></div>' +
    '<svg class="plot" viewBox="0 0 ' + W + ' ' + H + '" style="min-width:620px" role="img" aria-label="Schedule of ' + ts.length + ' items">' +
    grid + '<line x1="' + nx.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y1="12" y2="' + (H - 4) +
      '" stroke="var(--red)" stroke-width="1"/><text class="lbl" x="' + (nx + 3).toFixed(1) + '" y="9" fill="var(--red)">today</text>' +
    bars + '</svg>' +
    '<p class="note" style="margin-top:6px">Solid = on the stone · faint = standing · red = past due · grey = printed</p>';

  $$('.grow', c).forEach(function (g) { g.addEventListener('click', function () { sel(g.dataset.task); }); });
}

function rLedger(c) {
  var s = PT.stats(S.project), m = PT.momentum(), f = PT.forecast(S.project);
  var landing = f.done ? 'complete' : !isFinite(f.days) ? 'no measurable pace' : PT.shortDate(f.date.getTime());
  var trend = m.trend > .15 ? 'rising' : m.trend < -.15 ? 'falling' : 'steady';
  var row = function (k, v, w) { return '<tr><th scope="row">' + esc(k) + '</th><td class="' + (w ? 'warn' : '') + '">' + esc(v) + '</td></tr>'; };

  var series = PT.timeline(30);
  var plot = '';
  if (series.length > 1) {
    var W = 280, H = 76, PL = 20, PB = 12, PTp = 6;
    var max = Math.max(1, Math.max.apply(null, series.map(function (d) { return d.total; })));
    var xx = function (i) { return PL + (i / (series.length - 1)) * (W - PL - 4); };
    var yy = function (v) { return PTp + (1 - v / max) * (H - PTp - PB); };
    var open = series.map(function (d, i) { return (i ? 'L' : 'M') + xx(i).toFixed(1) + ' ' + yy(d.open).toFixed(1); }).join(' ');
    var done = series.map(function (d, i) { return (i ? 'L' : 'M') + xx(i).toFixed(1) + ' ' + yy(d.done).toFixed(1); }).join(' ');
    var last = series[series.length - 1];
    plot = '<svg class="plot" viewBox="0 0 ' + W + ' ' + H + '" style="margin-top:10px" role="img" ' +
      'aria-label="' + last.open + ' open and ' + last.done + ' printed over thirty days">' +
      '<line x1="' + PL + '" x2="' + (W - 4) + '" y1="' + yy(0) + '" y2="' + yy(0) + '" stroke="var(--rule)" stroke-width=".5"/>' +
      '<line x1="' + PL + '" x2="' + (W - 4) + '" y1="' + yy(max) + '" y2="' + yy(max) + '" stroke="var(--rule)" stroke-width=".5"/>' +
      '<text x="' + (PL - 3) + '" y="' + (yy(max) + 2.5) + '" text-anchor="end">' + max + '</text>' +
      '<text x="' + (PL - 3) + '" y="' + (yy(0) + 2.5) + '" text-anchor="end">0</text>' +
      '<path d="' + open + '" fill="none" stroke="var(--red)" stroke-width="1.2"/>' +
      '<path d="' + done + '" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 2"/>' +
      '<text class="lbl" x="' + (W - 5) + '" y="' + (yy(last.open) - 3) + '" text-anchor="end">open ' + last.open + '</text>' +
      '<text class="lbl" x="' + (W - 5) + '" y="' + (yy(last.done) + 8) + '" text-anchor="end">printed ' + last.done + '</text></svg>' +
      '<p class="note">Thirty days</p>';
  }

  c.innerHTML = '<div class="hd">By the numbers</div><table class="fig"><tbody>' +
    row('Standing', s.todo) + row('On the stone', s.doing) + row('Printed', s.done + ' / ' + s.total) +
    row('Past due', s.overdue, s.overdue > 0) + row('Hours out', s.hoursLeft + 'h') +
    row('Complete', s.pct + '%') + row('Pace', m.perWeek + '/wk') + row('Trend', trend, m.trend < -.15) +
    row('Goes to press', landing, !isFinite(f.days)) +
    '</tbody></table>' + plot +
    '<p style="margin-top:10px"><button class="chip red" id="rst" type="button">Reset the archive</button></p>';

  $('#rst', c).addEventListener('click', function () {
    PT.reset(); S.project = PT.projects()[0] ? PT.projects()[0].id : null; S.selected = null;
    projects(); say('Reset');
  });
}

function rMorgue(c) {

/* ==========================================================================
   EDITIONS (saved arrangements)
   ========================================================================== */
function allEds() {
  var o = {};
  Object.keys(EDITIONS).forEach(function (k) { o[k] = EDITIONS[k]; });
  Object.keys(S.custom).forEach(function (k) { o[k] = S.custom[k]; });
  return o;
}

function setEdition(k) {
  var ed = allEds()[k]; if (!ed) return;
  S.edition = k;
  openIds().forEach(function (id) { if (ed.open.indexOf(id) < 0) close(id); });
  ed.open.forEach(function (id) {
    var e = open(id, resolveGeo(ed.geo && ed.geo[id]));
    if (e && !REDUCED) {
      e.classList.add('animating');
      setTimeout(function () { e.classList.remove('animating'); }, 250);
    }
  });
  S.tab = ed.open[0] || 'galley';
  edRail(); tabs(); syncStick(); save();
  say(ed.name + ' edition');
}

function edRail() {
  var all = allEds();
  $('#editions').innerHTML = Object.keys(all).map(function (k) {
    return '<button class="chip" type="button" data-ed="' + esc(k) + '" aria-pressed="' +
      (S.edition === k ? 'true' : 'false') + '">' + esc(all[k].name) + '</button>';
  }).join('');
  $$('#editions [data-ed]').forEach(function (b) {
    b.addEventListener('click', function () { setEdition(b.dataset.ed); });
    b.addEventListener('contextmenu', function (e) {
      if (!S.custom[b.dataset.ed]) return;
      e.preventDefault();
      delete S.custom[b.dataset.ed];
      if (S.edition === b.dataset.ed) S.edition = 'morning';
      edRail(); save(); say('Edition removed');
    });
  });
}

$('#saveEd').addEventListener('click', function () {
  var name = window.prompt('Name this edition');
  if (!name || !name.trim()) return;
  var key = 'u_' + name.trim().toLowerCase().replace(/\W+/g, '_'), geo = {};
  openIds().forEach(function (id) {
    var w = S.wins[id];
    geo[id] = [Math.round(w.x), Math.round(w.y), Math.round(w.w), Math.round(w.h)];
  });
  S.custom[key] = { name: name.trim(), open: openIds(), geo: geo };
  S.edition = key; edRail(); save();
  say('Saved edition ' + name.trim() + '. Right-click a saved edition to remove it.');
});

/* ==========================================================================
   CHROME
   ========================================================================== */
function syncStick() {
  var st = $('#stick');
  if (!st.childElementCount) {
    st.innerHTML = Object.keys(P).map(function (id) {
      return '<button class="slug" type="button" data-slug="' + id + '"><span class="mark"></span>' + esc(P[id].title) + '</button>';
    }).join('') + '<span style="flex:1 1 auto"></span><span class="note">Alt+← → square up · Alt+↓ set aside</span>';
    $$('[data-slug]', st).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.slug, w = S.wins[id];
        if (w && w.open && !w.min) close(id);
        else { open(id); focus(id); S.tab = id; tabs(); }
        save();
      });
    });
  }
  $$('[data-slug]', st).forEach(function (b) {
    var w = S.wins[b.dataset.slug];
    b.dataset.open = (w && w.open && !w.min) ? '1' : '0';
  });
  tabs();
}

function tabs() {
  var ids = openIds();
  $('#tabs').innerHTML = ids.map(function (id) {
    return '<button class="chip" type="button" role="tab" data-tab="' + id + '" aria-selected="' +
      (S.tab === id ? 'true' : 'false') + '" aria-pressed="' + (S.tab === id ? 'true' : 'false') + '">' +
      esc(P[id].title) + '</button>';
  }).join('');
  $$('#tabs [data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { S.tab = b.dataset.tab; tabs(); });
  });
  ids.forEach(function (id) { var e = el(id); if (e) e.classList.toggle('tabon', id === S.tab); });
}

function projects() {
  var ps = PT.projects();
  if (!ps.length) S.project = null;
  else if (!PT.project(S.project)) S.project = ps[0].id;
  $('#projSel').innerHTML = ps.map(function (p) {
    return '<option value="' + p.id + '"' + (p.id === S.project ? ' selected' : '') + '>' + esc(p.name) + '</option>';
  }).join('');
  conditions(); paintAll();
}

function conditions() {
  var ps = PT.projects();
  if (!ps.length) { $('#cond').textContent = 'No desks open'; return; }
  var avg = ps.reduce(function (a, p) { return a + PT.health(p.id); }, 0) / ps.length;
  var word = avg > .72 ? 'Clear' : avg > .55 ? 'Fair' : avg > .42 ? 'Unsettled' : 'Heavy weather';
  var s = PT.stats();
  $('#cond').textContent = word + ' · ' + s.overdue + ' past due · ' + s.hoursLeft + 'h out';
}

$('#projSel').addEventListener('change', function () {
  S.project = this.value; S.selected = null; paintAll(); save();
});

$('#dusk').addEventListener('click', function () {
  var d = document.documentElement.dataset.edition === 'dusk';
  document.documentElement.dataset.edition = d ? 'day' : 'dusk';
  this.setAttribute('aria-pressed', String(!d));
  try { localStorage.setItem('pt-pressroom-dusk', d ? '0' : '1'); } catch (e) {}
});

addEventListener('keydown', function (e) {
  var ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (!S.selected) return;
  var t = PT.task(S.selected); if (!t) return;
  var order = ['todo', 'doing', 'done'], i = order.indexOf(t.status);
  if (e.key === ']') { e.preventDefault(); PT.moveTask(t.id, order[Math.min(2, i + 1)]); }
  else if (e.key === '[') { e.preventDefault(); PT.moveTask(t.id, order[Math.max(0, i - 1)]); }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault(); PT.removeTask(t.id); S.selected = null; say('Spiked ' + t.title);
  }
});

/* ==========================================================================
   PERSISTENCE + BOOT
   ========================================================================== */
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ wins: S.wins, edition: S.edition, custom: S.custom, project: S.project }));
  } catch (e) { /* private mode — arrangement just won't survive a reload */ }
}

function load() {
  try {
    var raw = localStorage.getItem(KEY); if (!raw) return false;
    var s = JSON.parse(raw); if (!s || !s.wins) return false;
    S.wins = s.wins; S.edition = s.edition || 'morning'; S.custom = s.custom || {};
    if (s.project && PT.project(s.project)) S.project = s.project;
    Object.keys(S.wins).forEach(function (id) {
      if (!P[id]) { delete S.wins[id]; return; }
      zTop = Math.max(zTop, S.wins[id].z || 0);
      if (S.wins[id].open) open(id);
    });
    return openIds().length > 0;
  } catch (e) { return false; }
}

var rt = 0;
addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () {
    openIds().forEach(function (id) { clampW(S.wins[id]); geoApply(id); });
    tabs();
  }, 120);
});

PT.on('change', function () { conditions(); paintAll(); });

try { if (localStorage.getItem('pt-pressroom-dusk') === '1') {
  document.documentElement.dataset.edition = 'dusk';
  $('#dusk').setAttribute('aria-pressed', 'true');
} } catch (e) {}

projects();
if (!load()) setEdition('morning');
else { edRail(); syncStick(); tabs(); }
paintAll();
var f0 = openIds()[0]; if (f0) focus(f0);
})();
</script>
</body>
</html>
