<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TERMINAL — Project Tracker Lab</title>
<meta name="color-scheme" content="dark">
<meta name="description" content="Project Tracker rendered as a live phosphor terminal — the board is text, the fastest path is typing.">
<style>
/* ===========================================================================
   TERMINAL — design tokens
   Phosphor CRT. One font size everywhere: the ASCII board is drawn by counting
   characters, so any variation in cell width would shear the box-drawing grid.
   ========================================================================= */
:root{
  --bg:        #08090a;
  --bg-lift:   #0d0f11;
  --bg-sel:    #16302180;

  --green:     #4ade80;   /* phosphor primary            10.0:1 on --bg */
  --green-deep:#2b7a4b;   /* filled-history bars only, never text       */
  --amber:     #fbbf24;   /* in progress                 10.4:1         */
  --red:       #f87171;   /* overdue                      7.2:1         */
  --txt:       #e2e8f0;   /* emphasis                                   */
  --dim:       #94a3b8;   /* secondary TEXT — 7.8:1, safe for reading   */
  --rule:      #64748b;   /* box-drawing chrome only (aria-hidden)      */
  --rule-deep: #333d4c;

  --focus:     #4ade80;
  --bloom:     0 0 6px rgba(74,222,128,.35);

  /* --cw is the measured advance width of one character; JS keeps it true.
     The block cursor is positioned in multiples of it. */
  --cw: 8px;

  --u: 8px;                 /* 8px baseline unit */
  --fs: clamp(11.5px, 0.62vw + 9px, 14.5px);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  font-size:var(--fs);
  line-height:1.6;
  font-variant-ligatures:none;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;                 /* the scrollback scrolls, the page never does */
}

/* --- shell ------------------------------------------------------------- */
.shell{
  position:relative;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  height:100vh;
  height:100dvh;
  isolation:isolate;
}

/* --- statusline (tmux/vim idiom) --------------------------------------- */
.status{
  display:flex;
  flex-wrap:wrap;
  align-items:stretch;
  gap:2px;
  padding:2px 2px 2px 0;
  background:var(--bg-lift);
  border-bottom:1px solid var(--rule-deep);
  min-height:calc(var(--u) * 3);
}
.seg{
  display:inline-flex;
  align-items:center;
  padding:0 var(--u);
  white-space:nowrap;
  color:var(--dim);
}
.seg-mode{
  background:var(--green);
  color:#04120a;
  font-weight:700;
  letter-spacing:.08em;
}
.seg-mode.is-replay{ background:var(--amber); color:#1a1201; }
.seg-proj{ color:var(--txt); }
.seg-proj .glyph{ margin-right:.5ch; }
.seg-warn{ color:var(--red); }
.seg-num{ color:var(--green); text-shadow:var(--bloom); }
.status .spacer{ flex:1 1 auto; min-width:var(--u); }
.status .sbtn{
  font:inherit;
  border:1px solid var(--rule-deep);
  background:transparent;
  color:var(--dim);
  padding:0 var(--u);
  cursor:pointer;
}
.status .sbtn:hover{ color:var(--green); border-color:var(--green); }

.lab-back{
  display:inline-flex;
  align-items:center;
  padding:0 var(--u);
  background:var(--rule-deep);
  color:var(--txt);
  text-decoration:none;
  letter-spacing:.06em;
}
.lab-back:hover{ background:var(--green); color:#04120a; }

/* --- scrollback -------------------------------------------------------- */
.sb{
  overflow-y:auto;
  overflow-x:auto;
  overscroll-behavior:contain;
  padding:var(--u) var(--u) 0;
  scrollbar-width:thin;
  scrollbar-color:var(--rule-deep) transparent;
}
.sb::-webkit-scrollbar{ width:10px; height:10px; }
.sb::-webkit-scrollbar-thumb{ background:var(--rule-deep); }
.stream{ min-width:0; }
.blk{ margin:0 0 var(--u); }
.blk:last-child{ margin-bottom:calc(var(--u) * 2); }

/* Grid blocks are character-counted: never wrap them or the board shears.
   Flow blocks are prose and wrap freely. */
.grid{ white-space:pre; }
.flow{ white-space:pre-wrap; overflow-wrap:anywhere; }

/* Character-width probe. It renders 100 'M's, so it must live inside a
   zero-size clipping box — an absolutely positioned 630px span still counts
   toward document scrollWidth and was forcing a horizontal scrollbar at 360px.
   getBoundingClientRect() reports the true border box regardless of the
   ancestor's overflow, so the measurement is unaffected. */
.measbox{ position:fixed; top:0; left:0; width:0; height:0; overflow:hidden; pointer-events:none; }
.meas{ position:static; visibility:hidden; white-space:pre; pointer-events:none; }

/* --- semantic ink ------------------------------------------------------ */
.gr{ color:var(--green); }
.gr-bloom{ color:var(--green); text-shadow:var(--bloom); }
.am{ color:var(--amber); }
.rd{ color:var(--red); }
.dm{ color:var(--dim); }
.hi{ color:var(--txt); }
.ru{ color:var(--rule); }
.deep{ color:var(--green-deep); }
.echo{ color:var(--dim); }
.echo b{ color:var(--txt); font-weight:400; }

/* --- clickable board cell ---------------------------------------------
   A real <button> stripped to bare text so it occupies exactly the same
   character cells as the span it replaces — anything with padding, border
   or a different font would break the ASCII grid. */
.cell{
  font:inherit;
  color:inherit;
  background:none;
  border:0;
  padding:0;
  margin:0;
  white-space:pre;
  text-align:left;
  cursor:pointer;
  vertical-align:baseline;
}
.cell:hover{ background:var(--bg-sel); }
.cell:focus-visible{ outline:2px solid var(--focus); outline-offset:-2px; }

/* --- chips (replay transport) ------------------------------------------ */
.chips{ display:flex; flex-wrap:wrap; gap:var(--u); margin-top:var(--u); }
.chip{
  font:inherit;
  background:transparent;
  color:var(--dim);
  border:1px solid var(--rule-deep);
  padding:0 var(--u);
  cursor:pointer;
}
.chip:hover{ color:var(--amber); border-color:var(--amber); }

/* --- prompt ------------------------------------------------------------ */
.prompt{
  display:flex;
  align-items:center;
  gap:var(--u);
  padding:var(--u);
  border-top:1px solid var(--rule-deep);
  background:var(--bg-lift);
}
.ps1{ color:var(--green); text-shadow:var(--bloom); white-space:nowrap; }
.ps1.is-replay{ color:var(--amber); text-shadow:none; }
.field{ position:relative; flex:1 1 auto; min-width:0; display:flex; }
#cmd{
  font:inherit;
  width:100%;
  background:transparent;
  border:0;
  outline:0;
  color:var(--txt);
  caret-color:transparent;         /* the block cursor below replaces it */
  padding:0;
}
#cmd::placeholder{ color:var(--rule); }
#cmd:focus-visible{ outline:0; }
.field:focus-within{ box-shadow:0 1px 0 var(--green); }
.curs{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:var(--cw);
  background:var(--green);
  opacity:.8;
  pointer-events:none;
  transform:translateX(0);
}
.curs.blink{ animation:blink 1.06s steps(1,end) infinite; }
.curs.hide{ display:none; }
@keyframes blink{ 0%,55%{opacity:.85} 56%,100%{opacity:0} }

/* --- CRT overlays ------------------------------------------------------
   Fixed, pointer-events:none, transform/opacity only. */
.crt{ position:fixed; inset:0; pointer-events:none; z-index:40; }
.crt-scan{
  background:repeating-linear-gradient(180deg,
    rgba(0,0,0,.30) 0 1px, rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:multiply;
}
.crt-vig{
  background:
    radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 100%);
  opacity:.9;
  animation:breathe 7.5s ease-in-out infinite;
}
@keyframes breathe{ 0%,100%{opacity:.82} 50%{opacity:.98} }
.crt-roll{
  height:26vh;
  top:-26vh;
  bottom:auto;
  background:linear-gradient(180deg, rgba(74,222,128,0) 0%, rgba(74,222,128,.045) 50%, rgba(74,222,128,0) 100%);
  animation:roll 9s linear infinite;
  will-change:transform;
}
@keyframes roll{ from{ transform:translate3d(0,0,0) } to{ transform:translate3d(0,126vh,0) } }

/* --- focus ------------------------------------------------------------- */
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.sb:focus-visible{ outline-offset:-2px; }

.sr{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
}

@media (max-width:520px){
  .status .opt{ display:none; }        /* velocity segment: nice, not vital */
}

@media (prefers-reduced-motion: reduce){
  .crt-roll{ display:none; }
  .crt-vig{ animation:none; opacity:.9; }
  .curs.blink{ animation:none; }
  *{ transition:none !important; }
}
</style>
</head>
<body>
<div class="shell">

  <header class="status" id="status" role="banner" aria-label="terminal status line">
    <a class="lab-back" href="./index.html">Lab</a>
    <span class="seg seg-mode" id="segMode">PT</span>
    <span class="seg seg-proj" id="segProj">booting…</span>
    <span class="seg" id="segOpen"></span>
    <span class="seg" id="segOver"></span>
    <span class="seg opt" id="segVel"></span>
    <span class="spacer"></span>
    <button class="sbtn" type="button" id="btnHelp">help</button>
    <button class="sbtn" type="button" id="btnReset">reset data</button>
  </header>

  <main class="sb" id="sb" tabindex="0" role="log" aria-label="terminal scrollback">
    <div class="stream" id="stream" aria-live="polite" aria-atomic="false"></div>
    <span class="measbox" aria-hidden="true"><span class="meas" id="meas"></span></span>
  </main>

  <form class="prompt" id="promptForm" autocomplete="off">
    <label class="ps1" id="ps1" for="cmd">~/pt&nbsp;&gt;</label>
    <span class="field">
      <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off"
             autocorrect="off" aria-label="command line — type help for commands">
      <span class="curs blink" id="curs" aria-hidden="true"></span>
    </span>
  </form>

  <div class="crt crt-scan" aria-hidden="true"></div>
  <div class="crt crt-vig" aria-hidden="true"></div>
  <div class="crt crt-roll" aria-hidden="true"></div>
</div>

<script src="_kernel.js"></script>
<script>
(function () {
  'use strict'

  var PT = window.PT
  var $ = function (id) { return document.getElementById(id) }
  var stream = $('stream'), sb = $('sb'), input = $('cmd'), curs = $('curs'), meas = $('meas')

  if (!PT) {
    stream.innerHTML = '<div class="blk flow rd">pt: kernel not found — _kernel.js failed to load. ' +
      'This page must sit next to _kernel.js.</div>'
    input.disabled = true
    return
  }

  /* ======================================================================
     GRID PRIMITIVES
     The board is drawn by counting characters, so every helper below is
     about one thing: a cell is exactly N columns wide, always.
     ==================================================================== */

  var PRIO_GLYPH = { high: '█', medium: '▓', low: '░' }   // █ ▓ ░
  var PRIO_INK   = { high: 'hi',     medium: 'gr',     low: 'ru' }
  var STATUS_INK = { todo: 'hi', doing: 'am', done: 'dm' }
  var COL_ORDER  = ['todo', 'doing', 'done']
  var COL_INK    = { todo: 'gr', doing: 'am', done: 'dm' }

  var TRANSLIT = {
    '—': '-', '–': '-', '−': '-',
    '‘': "'", '’': "'", '“': '"', '”': '"',
    '→': '->', '·': '-', ' ': ' '
  }

  /**
   * Anything drawn into the character grid passes through here. Emoji and CJK
   * are double-width in a monospace font and would shear every row below them,
   * so unknown non-ASCII collapses to '?' — one code unit, one column.
   */
  function gridText(s) {
    s = String(s == null ? '' : s)
    var out = ''
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i), c = s.charCodeAt(i)
      if (c >= 32 && c < 127) out += ch
      else if (TRANSLIT[ch] !== undefined) out += TRANSLIT[ch]
      else if (c === 9) out += ' '
      else if (c < 32) { /* drop control chars */ }
      else out += '?'
    }
    return out
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }
  function rep(ch, n) { return n > 0 ? new Array(n + 1).join(ch) : '' }
  function padR(s, w) { s = String(s); return s.length >= w ? s : s + rep(' ', w - s.length) }
  function padL(s, w) { s = String(s); return s.length >= w ? s : rep(' ', w - s.length) + s }
  function trunc(s, w) {
    s = String(s)
    if (w <= 0) return ''
    return s.length <= w ? s : s.slice(0, w - 1) + '…'
  }
  function fit(s, w) { return padR(trunc(s, w), w) }
  function ink(cls, text) { return '<span class="' + cls + '">' + esc(text) + '</span>' }
  function chrome(text) { return '<span class="ru" aria-hidden="true">' + esc(text) + '</span>' }

  /* ======================================================================
     APP STATE
     ==================================================================== */

  var MAX_LINES = 640          // scrollback cap — memory must not grow forever
  var MAX_BOARD_ROWS = 14
  var REPLAY_STEP_MS = 220

  var S = {
    scope: null,               // project id, or null = all projects
    blocks: [],
    lines: 0,
    history: [],
    hIdx: -1,
    draft: '',
    cols: 80,
    cw: 8,
    replay: null,
    raf: 0
  }

  var firstProject = PT.projects()[0]
  S.scope = firstProject ? firstProject.id : null

  function scopeName() {
    if (!S.scope) return 'all projects'
    var p = PT.project(S.scope)
    return p ? p.name : 'all projects'
  }
  function scopeTasks() { return S.scope ? PT.tasks({ project: S.scope }) : PT.tasks() }

  /** Project letter used in the root board — ASCII, so it can never shear a row. */
  function projLetter(pid) {
    var p = PT.project(pid)
    return p && p.name ? gridText(p.name.charAt(0)).toUpperCase().slice(0, 1) || '?' : '?'
  }

  /**
   * Task metadata for ids that may no longer exist. snapshotAt() can hand back
   * a task that has since been deleted; the log still remembers what it was.
   */
  function logIndex() {
    var idx = {}
    var log = PT.state.log
    for (var i = 0; i < log.length; i++) {
      if (log[i].type === 'task.add') idx[log[i].id] = { title: log[i].title, project: log[i].project }
    }
    return idx
  }

  /* ======================================================================
     SCROLLBACK — a list of re-renderable blocks.

     Blocks re-render on resize so the ASCII grid stays true at any width.
     History is honest though: a block freezes its data the moment it stops
     being the live one, so a resize reflows old output without rewriting it.
     ==================================================================== */

  function mount(b) {
    var el = document.createElement('div')
    el.className = 'blk ' + (b.cls || 'flow')
    b.el = el
    render(b)
    stream.appendChild(el)
    S.blocks.push(b)
    trim()
  }

  function render(b) {
    var html = b.render(S.cols)
    b.lines = (html.match(/\n/g) || []).length + 1
    b.el.innerHTML = html
  }

  function trim() {
    S.lines = 0
    for (var i = 0; i < S.blocks.length; i++) S.lines += (S.blocks[i].lines || 1)
    while (S.blocks.length > 2 && S.lines > MAX_LINES) {
      var gone = S.blocks.shift()
      S.lines -= (gone.lines || 1)
      if (gone.el && gone.el.parentNode) gone.el.parentNode.removeChild(gone.el)
    }
  }

  function atBottom() { return sb.scrollHeight - sb.scrollTop - sb.clientHeight < 48 }
  function toBottom() { sb.scrollTop = sb.scrollHeight }

  /** Plain output. `html` may contain markup already escaped by the caller. */
  function out(html, cls) {
    var stick = atBottom()
    mount({ cls: cls || 'flow', render: function () { return html } })
    if (stick) toBottom()
  }
  function line(text, cls) { out(ink(cls || 'dm', text)) }
  function err(text) { out(ink('rd', 'pt: ' + text)) }
  function ok(text) { out(ink('gr', text)) }
  function blank() { out('&nbsp;') }

  /* ======================================================================
     BOARD
     ==================================================================== */

  function dueTag(due, status) {
    if (status === 'done' || !due) return { t: '    ', c: 'dm' }
    var d = Math.round((due - Date.now()) / PT.DAY)
    if (d < 0) return { t: padL('-' + Math.min(99, Math.abs(d)) + 'd', 4), c: 'rd' }
    if (d === 0) return { t: ' TDY', c: 'am' }
    return { t: padL('+' + Math.min(99, d) + 'd', 4), c: d <= 3 ? 'am' : 'dm' }
  }

  function itemFrom(task, n) {
    return {
      n: n, id: task.id, title: task.title, priority: task.priority,
      due: task.due, status: task.status, project: task.projectId
    }
  }

  /** Model for the board as it stands right now. */
  function liveModel() {
    var all = scopeTasks()
    var cols = { todo: [], doing: [], done: [] }
    all.forEach(function (t, i) { if (cols[t.status]) cols[t.status].push(itemFrom(t, i + 1)) })
    return { cols: cols, root: !S.scope, interactive: true, caption: scopeName(), maxN: all.length }
  }

  /** Model for the board as it stood at `ts`. */
  function snapshotModel(ts, idx) {
    var snap = PT.snapshotAt(ts)
    var live = scopeTasks()
    var nOf = {}
    live.forEach(function (t, i) { nOf[t.id] = i + 1 })

    var cols = { todo: [], doing: [], done: [] }
    var ids = Object.keys(snap)
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i]
      var t = PT.task(id)
      var meta = t || idx[id]
      if (!meta) continue
      var pid = t ? t.projectId : meta.project
      if (S.scope && pid !== S.scope) continue
      var st = snap[id]
      if (!cols[st]) continue
      cols[st].push({
        n: nOf[id] || null,
        id: id,
        title: (t ? t.title : meta.title) || '(untitled)',
        priority: t ? t.priority : 'medium',
        due: null,                       // due dates aren't versioned in the log
        status: st,
        project: pid
      })
    }
    COL_ORDER.forEach(function (k) {
      cols[k].sort(function (a, b) { return (a.n || 999) - (b.n || 999) })
    })
    return { cols: cols, root: !S.scope, interactive: false, caption: scopeName(), maxN: live.length }
  }

  function cellHTML(it, w, model) {
    var inner = w - 2
    var idxW = String(Math.max(9, model.maxN || 9)).length
    var projPart = model.root ? projLetter(it.project) + ' ' : ''
    var used = idxW + 3 + projPart.length + 5     // idx, ' ', glyph, ' ', proj, ' '+due(4)
    var tw = Math.max(4, inner - used)
    var due = dueTag(it.due, it.status)
    var glyph = PRIO_GLYPH[it.priority] || PRIO_GLYPH.medium

    var body =
      ' ' + ink('dm', padL(it.n === null ? '·' : it.n, idxW)) +
      ' ' + ink(PRIO_INK[it.priority] || 'gr', glyph) +
      ' ' + (projPart ? ink('dm', projPart) : '') +
      ink(STATUS_INK[it.status] || 'hi', fit(gridText(it.title), tw)) +
      ' ' + ink(due.c, due.t) + ' '

    if (!model.interactive) return '<span>' + body + '</span>'

    var label = it.n + '. ' + it.title + ', ' + it.status + ', ' + it.priority + ' priority' +
      (it.due ? ', due ' + PT.relDay(it.due) : '')
    return '<button type="button" class="cell" data-n="' + it.n + '" data-status="' + it.status +
      '" aria-label="' + esc(label) + '">' + body + '</button>'
  }

  function emptyCell(w, label) {
    return '<span class="ru">' + esc(fit(' ' + label, w)) + '</span>'
  }

  function drawBoard(model, cols) {
    var widths = splitWidths(cols)
    if (!widths) return drawBoardStacked(model, cols)

    var counts = {}
    COL_ORDER.forEach(function (k) { counts[k] = model.cols[k].length })
    var rows = Math.max(counts.todo, counts.doing, counts.done)
    var shown = Math.min(rows, MAX_BOARD_ROWS)
    var html = ''

    html += chrome('┌' + widths.map(function (w) { return rep('─', w) }).join('┬') + '┐') + '\n'

    // header row
    html += chrome('│')
    COL_ORDER.forEach(function (k, i) {
      var w = widths[i]
      var label = k.toUpperCase()
      var cnt = String(counts[k])
      var mid = Math.max(1, w - 2 - label.length - cnt.length)
      html += '<span class="' + COL_INK[k] + '">' + esc(' ' + label) + '</span>' +
        chrome(rep(' ', mid)) + ink('dm', cnt + ' ')
      html += chrome('│')
    })
    html += '\n'

    html += chrome('├' + widths.map(function (w) { return rep('─', w) }).join('┼') + '┤') + '\n'

    if (rows === 0) {
      html += chrome('│')
      COL_ORDER.forEach(function (k, i) {
        html += emptyCell(widths[i], '(empty)') + chrome('│')
      })
      html += '\n'
    }

    for (var r = 0; r < shown; r++) {
      html += chrome('│')
      for (var c = 0; c < 3; c++) {
        var key = COL_ORDER[c], w = widths[c]
        var it = model.cols[key][r]
        html += it ? cellHTML(it, w, model) : chrome(rep(' ', w))
        html += chrome('│')
      }
      html += '\n'
    }

    if (rows > shown) {
      html += chrome('│')
      for (var c2 = 0; c2 < 3; c2++) {
        var k2 = COL_ORDER[c2], w2 = widths[c2]
        var extra = counts[k2] - shown
        html += extra > 0
          ? ink('dm', fit('  +' + extra + ' more', w2))
          : chrome(rep(' ', w2))
        html += chrome('│')
      }
      html += '\n'
    }

    html += chrome('└' + widths.map(function (w) { return rep('─', w) }).join('┴') + '┘')
    return html
  }

  /** null when the viewport can't hold three legible columns. */
  function splitWidths(cols) {
    var usable = Math.min(cols, 132) - 4
    var base = Math.floor(usable / 3)
    if (base < 20) return null
    var rem = usable - base * 3
    return [base + (rem > 0 ? 1 : 0), base + (rem > 1 ? 1 : 0), base]
  }

  /** Narrow fallback: same information, stacked, still drawn with box rules. */
  function drawBoardStacked(model, cols) {
    var w = Math.min(cols, 132)
    var html = ''
    COL_ORDER.forEach(function (k, ci) {
      var list = model.cols[k]
      var label = ' ' + k.toUpperCase() + ' '
      var cnt = ' ' + list.length + ' '
      var dash = Math.max(2, w - 2 - label.length - cnt.length)
      html += chrome('├') + '<span class="' + COL_INK[k] + '">' + esc(label) + '</span>' +
        chrome(rep('─', dash)) + ink('dm', cnt) + chrome('┤') + '\n'
      if (!list.length) html += ink('ru', '   (empty)') + '\n'
      var shown = Math.min(list.length, MAX_BOARD_ROWS)
      for (var i = 0; i < shown; i++) html += cellHTML(list[i], w, model) + '\n'
      if (list.length > shown) html += ink('dm', '   +' + (list.length - shown) + ' more') + '\n'
      if (ci < 2) html += '\n'
    })
    return html.replace(/\n$/, '')
  }

  /* --- board blocks ------------------------------------------------------
     Only the newest board is live and clickable. Older ones freeze into inert
     text, which also keeps the tab order sane — one board's worth of stops. */

  var liveBoard = null

  function freezeBoards() {
    if (!liveBoard) return
    liveBoard.frozen = liveBoard.frozen || liveModelSnapshotOf(liveBoard)
    liveBoard = null
  }
  function liveModelSnapshotOf(b) {
    var m = b.model()
    m.interactive = false
    return m
  }

  function pushBoard() {
    freezeBoards()
    var stick = atBottom()
    var b = {
      cls: 'grid',
      kind: 'board',
      frozen: null,
      model: liveModel,
      render: function (cols) { return drawBoard(this.frozen || this.model(), cols) }
    }
    mount(b)
    liveBoard = b
    if (stick) toBottom()
    return b
  }

  /* ======================================================================
     STATUS LINE
     ==================================================================== */

  function paintStatus() {
    var R = S.replay
    $('segMode').textContent = R ? 'REPLAY' : 'PT'
    $('segMode').className = 'seg seg-mode' + (R ? ' is-replay' : '')

    var p = S.scope ? PT.project(S.scope) : null
    $('segProj').innerHTML = p
      ? '<span class="glyph" aria-hidden="true" style="color:' + esc(p.color) + '">' + esc(p.glyph) + '</span>' + esc(p.name)
      : 'all projects'

    if (R) {
      var f = R.frames[R.i]
      var c = replayCounts(R)
      $('segOpen').innerHTML = ink('am', new Date(f).toDateString().slice(0, 10)) +
        ink('dm', '  ' + (R.i + 1) + '/' + R.frames.length)
      $('segOver').innerHTML = ink('gr', c.done + ' done') + ink('dm', ' · ') +
        ink('am', c.doing + ' doing') + ink('dm', ' · ' + c.todo + ' todo')
      $('segVel').innerHTML = ink('dm', R.playing ? '▶ playing' : '‖ paused')
      return
    }

    var s = PT.stats(S.scope || undefined)
    var m = PT.momentum(14, S.scope || undefined)
    $('segOpen').innerHTML = '<span class="seg-num">' + (s.doing + s.todo) + '</span>' + ink('dm', ' open')
    $('segOver').innerHTML = s.overdue
      ? '<span class="seg-warn">' + s.overdue + ' overdue</span>'
      : ink('dm', 'nothing overdue')
    $('segVel').innerHTML = ink('dm', m.perWeek.toFixed(1) + '/wk · ' + s.pct + '% done')
  }

    html += '  ' + ink('hi', padR('@fri @today @3d @2026-08-14', 24)) + ink('dm', 'due date') + '\n'
    html += '  ' + ink('hi', padR('#tag', 24)) + ink('dm', 'tag, repeatable') + '\n'

      ink('rd', '-3d') + ink('dm', ' overdue  ') + ink('am', 'TDY') + ink('dm', ' due today  ') +

  function taskAt(n) {
    var list = scopeTasks()
    var i = parseInt(n, 10)
    if (!i || i < 1 || i > list.length) return null
    return list[i - 1]
  }

  function cmdLs(arg) {
    var list = scopeTasks()
    var nOf = {}
    list.forEach(function (t, i) { nOf[t.id] = i + 1 })

    var filtered = list, label = 'open'
    arg = (arg || '').trim().toLowerCase()
    if (arg.charAt(0) === '#') {
      var tag = arg.slice(1)
      filtered = list.filter(function (t) { return t.tags.indexOf(tag) >= 0 })
      label = '#' + tag
    } else if (arg === 'done' || arg === 'todo' || arg === 'doing') {
      filtered = list.filter(function (t) { return t.status === arg })
      label = arg
    } else if (arg === 'all') {
      label = 'all'
    } else if (!arg) {
      filtered = list.filter(function (t) { return t.status !== 'done' })
    } else {
      err('ls: unknown filter ‘' + arg + '’ — try: done | todo | doing | all | #tag')
      return
    }

    if (!filtered.length) {
      line('no tasks in ' + scopeName() + ' matching ' + label + '.')
      return
    }

    var payload = filtered.map(function (t) { return itemFrom(t, nOf[t.id]) })
    var root = !S.scope, maxN = list.length
    out(renderList(payload, S.cols, root, maxN, label), 'grid')
    S.blocks[S.blocks.length - 1].render = function (cols) {
      return renderList(payload, cols, root, maxN, label)
    }
  }

  function renderList(items, cols, root, maxN, label) {
    var w = Math.min(cols, 132)
    var idxW = String(Math.max(9, maxN)).length
    var html = ink('dm', label + ' · ' + items.length + ' task' + (items.length === 1 ? '' : 's')) + '\n'
    items.forEach(function (it) {
      var projPart = root ? projLetter(it.project) + ' ' : ''
      var st = padR(it.status, 6)
      var due = dueTag(it.due, it.status)
      var tw = Math.max(6, w - (idxW + 3 + projPart.length + 7 + 5))
      html += ink('dm', padL(it.n, idxW)) + ' ' +
        ink(PRIO_INK[it.priority] || 'gr', PRIO_GLYPH[it.priority] || PRIO_GLYPH.medium) + ' ' +
        (projPart ? ink('dm', projPart) : '') +
        ink(STATUS_INK[it.status], fit(gridText(it.title), tw)) + ' ' +
        ink(it.status === 'doing' ? 'am' : 'ru', st) + ' ' +
        ink(due.c, due.t) + '\n'
    })
    return html.replace(/\n$/, '')
  }

  function cmdCd(arg) {
    arg = (arg || '').trim()
    var ps = PT.projects()

    if (arg === '..' || arg === '/' || arg === '') {
      if (arg === '..' || arg === '/') S.scope = null
      out(renderProjects(S.cols), 'grid')
      S.blocks[S.blocks.length - 1].render = renderProjects
      paintStatus()
      return
    }

    var hit = null
    var n = parseInt(arg, 10)
    if (String(n) === arg && n >= 1 && n <= ps.length) hit = ps[n - 1]
    if (!hit) {
      var q = arg.toLowerCase().replace(/\s+/g, '')
      hit = ps.filter(function (p) { return p.name.toLowerCase().replace(/\s+/g, '').indexOf(q) >= 0 })[0]
    }
    if (!hit) { err('cd: no such project ‘' + arg + '’ — try `cd ..` to list them'); return }

    S.scope = hit.id
    ok('→ ' + hit.name)
    paintStatus()
    pushBoard()
  }

  function renderProjects(cols) {
    var w = Math.min(cols, 132)
    var ps = PT.projects()
    if (!ps.length) return ink('dm', 'no projects. `reset` restores the seed dataset.')
    var html = ink('gr-bloom', 'PROJECTS') + ink('dm', '   cd <index|name>') + '\n'
    var nameW = Math.min(28, Math.max(12, w - 40))
    ps.forEach(function (p, i) {
      var s = PT.stats(p.id)
      var h = PT.health(p.id)
      var bars = Math.round(h * 10)
      var bar = rep('█', bars) + rep('░', 10 - bars)
      var hue = h > 0.66 ? 'gr' : h > 0.4 ? 'am' : 'rd'
      html += '  ' + ink('dm', padL(i + 1, 2)) + ' ' +
        ink(p.id === S.scope ? 'gr' : 'hi', fit(gridText(p.name), nameW)) + ' ' +
        ink(hue, bar) + ' ' +
        ink('dm', padL(Math.round(h * 100) + '%', 4)) + ' ' +
        ink('dm', padL(s.doing + s.todo, 3) + ' open') +
        (s.overdue ? ink('rd', padL(s.overdue, 4) + ' od') : ink('dm', rep(' ', 7))) +
        (p.id === S.scope ? ink('gr', '  ◀ here') : '') + '\n'
    })
    return html.replace(/\n$/, '')
  }

  function cmdAdd(rest) {
    if (!rest.trim()) { err('add: nothing to add. e.g. add ship the hero !high @fri ~6h #webgl'); return }
    var preview = PT.parse(rest)
    if (!preview.title) { err('add: that parsed to an empty title — the whole line was flags'); return }

    var fallback = S.scope || (PT.projects()[0] && PT.projects()[0].id)
    if (!fallback) { err('add: no project to add to. run `reset` to restore the seed dataset.'); return }

    var t = PT.quickAdd(rest, fallback)
    if (!t) { err('add: could not create that task'); return }

    var p = PT.project(t.projectId)
    var html = ink('gr-bloom', '+ ' + esc(gridText(t.title))) + '\n'
    html += '  ' + ink('dm', padR('project', 10)) + ink('hi', p ? p.name : '?') + '\n'
    html += '  ' + ink('dm', padR('priority', 10)) + ink(t.priority === 'high' ? 'hi' : 'gr', t.priority) + '\n'
    html += '  ' + ink('dm', padR('due', 10)) + ink(t.due ? 'am' : 'ru', t.due ? PT.relDay(t.due) + '  (' + PT.shortDate(t.due) + ')' : 'none') + '\n'
    html += '  ' + ink('dm', padR('estimate', 10)) + ink('hi', t.estimate + 'h') + '\n'
    html += '  ' + ink('dm', padR('energy', 10)) + ink('hi', t.energy) + '\n'
    html += '  ' + ink('dm', padR('tags', 10)) + ink(t.tags.length ? 'gr' : 'ru', t.tags.length ? '#' + t.tags.join(' #') : 'none')
    out(html, 'grid')
  }

  function cmdMv(nStr, statusStr) {
    var t = taskAt(nStr)
    if (!t) { err('mv: no task #' + (nStr || '?') + ' in ' + scopeName() + ' — run `ls` for indices'); return }
    var st = (statusStr || '').trim().toLowerCase()
    if (['todo', 'doing', 'done'].indexOf(st) < 0) { err('mv: status must be todo, doing or done'); return }
    if (t.status === st) { line(gridText(t.title) + ' is already ' + st + '.'); return }
    var from = t.status
    PT.moveTask(t.id, st)
    out(ink('dm', from) + ink('ru', ' → ') + ink(st === 'done' ? 'gr' : st === 'doing' ? 'am' : 'hi', st) +
      ink('ru', '  ·  ') + ink('hi', esc(gridText(t.title))), 'flow')
  }

  function cmdRm(nStr) {
    var t = taskAt(nStr)
    if (!t) { err('rm: no task #' + (nStr || '?') + ' in ' + scopeName() + ' — run `ls` for indices'); return }
    var title = t.title
    PT.removeTask(t.id)
    out(ink('rd', '✗ removed  ') + ink('dm', esc(gridText(title))) +
      ink('ru', '   (indices below it shift up)'), 'flow')

    html += '  ' + ink('dm', padR('why', 9)) + ink('am', esc(gridText(na.why))) + '\n'
    html += '  ' + ink('dm', padR('project', 9)) + ink('hi', esc(gridText(p ? p.name : '?'))) +

  function cmdStat() {
    var scope = S.scope || undefined
    var s = PT.stats(scope)
    var m = PT.momentum(14, scope)
    var f = PT.forecast(scope)
    var h = PT.health(S.scope)
    var name = scopeName()

    out(renderStat(s, m, f, h, name, S.cols), 'grid')
    S.blocks[S.blocks.length - 1].render = function (cols) { return renderStat(s, m, f, h, name, cols) }
  }

  function renderStat(s, m, f, h, name, cols) {
    var w = Math.min(cols, 132)
    var barW = Math.max(10, Math.min(30, w - 34))
    var filled = Math.round((s.pct / 100) * barW)
    var trendGlyph = m.trend > 0.05 ? '▲' : m.trend < -0.05 ? '▼' : '▶'
    var trendInk = m.trend > 0.05 ? 'gr' : m.trend < -0.05 ? 'rd' : 'dm'

    var rows = []
    rows.push(['tasks', ink('hi', s.total + '') + ink('dm', ' total · ') + ink('gr', s.done + ' done') +
      ink('dm', ' · ') + ink('am', s.doing + ' doing') + ink('dm', ' · ' + s.todo + ' todo')])
    rows.push(['progress', ink('gr', rep('█', filled)) + ink('ru', rep('░', barW - filled)) +
      ink('dm', '  ' + s.pct + '%')])
    rows.push(['health', ink(h > 0.66 ? 'gr' : h > 0.4 ? 'am' : 'rd', rep('█', Math.round(h * barW))) +
      ink('ru', rep('░', barW - Math.round(h * barW))) + ink('dm', '  ' + Math.round(h * 100) + '%')])
    rows.push(['overdue', s.overdue ? ink('rd', s.overdue + ' task' + (s.overdue === 1 ? '' : 's') + ' past due')
      : ink('dm', 'none')])
    rows.push(['workload', ink('hi', s.hoursLeft + 'h') + ink('dm', ' of estimate left')])
    rows.push(['velocity', ink('hi', m.perDay + '/day') + ink('dm', ' · ') + ink('hi', m.perWeek + '/week') +
      ink('dm', '  (' + m.completed + ' in ' + m.windowDays + 'd)  ') +
      ink(trendInk, trendGlyph + ' ' + (m.trend > 0 ? '+' : '') + Math.round(m.trend * 100) + '%')])
    rows.push(['forecast', f.done
      ? ink('gr', 'complete — nothing left')
      : (f.days === Infinity
        ? ink('rd', 'never at this pace — ' + f.remaining + ' left, 0/day')
        : ink('hi', '~' + f.days + ' days') + ink('dm', ' → ') + ink('am', PT.shortDate(f.date.getTime())) +
          ink('dm', '  (' + f.remaining + ' left at ' + f.perDay + '/day)'))])

    var html = ink('gr-bloom', esc(gridText(name).toUpperCase())) + '\n'
    rows.forEach(function (r, i) {
      var lead = i === rows.length - 1 ? '└─ ' : '├─ '
      html += chrome('  ' + lead) + ink('dm', padR(r[0], 10)) + r[1] + '\n'
    })
    return html.replace(/\n$/, '')
  }

  /* --- burndown ---------------------------------------------------------- */

  function projOf(id, idx) {
    var t = PT.task(id)
    if (t) return t.projectId
    return idx[id] ? idx[id].project : null
  }

  function scopedTimeline(days) {
    if (!S.scope) return PT.timeline(days)
    var idx = logIndex()
    var out2 = []
    var now = Date.now()
    for (var i = days; i >= 0; i--) {
      var ts = now - i * PT.DAY
      var snap = PT.snapshotAt(ts)
      var d = 0, g = 0, o = 0
      Object.keys(snap).forEach(function (id) {
        if (projOf(id, idx) !== S.scope) return
        if (snap[id] === 'done') d++
        else if (snap[id] === 'doing') g++
        else o++
      })
      out2.push({ ts: ts, done: d, doing: g, todo: o, open: g + o, total: d + g + o })
    }
    return out2
  }

  function cmdBurn() {
    var series = scopedTimeline(30)
    var name = scopeName()
    out(renderBurn(series, name, S.cols), 'grid')
    S.blocks[S.blocks.length - 1].render = function (cols) { return renderBurn(series, name, cols) }
  }

  function renderBurn(series, name, cols) {
    var max = 0
    series.forEach(function (p) { if (p.total > max) max = p.total })
    var head = ink('gr-bloom', 'BURNDOWN') + ink('dm', '  ' + gridText(name) + ' · 30 days') + '\n'
    if (!max) return head + ink('dm', '  no history in this window yet.')

    var labelW = Math.max(3, String(max).length)
    var plotW = Math.max(12, Math.min(60, Math.min(cols, 132) - labelW - 3))
    var rows = 12

    // Resample the daily series onto the available character columns.
    var pts = []
    for (var x = 0; x < plotW; x++) {
      var srcI = Math.round(x * (series.length - 1) / (plotW - 1))
      pts.push(series[srcI])
    }

    var html = head
    for (var r = rows - 1; r >= 0; r--) {
      var level = (r + 0.5) / rows * max
      var lbl = (r === rows - 1) ? String(max) : (r === Math.floor(rows / 2) ? String(Math.round(max / 2)) : (r === 0 ? '' : ''))
      html += ink('dm', padL(lbl, labelW)) + chrome(' ┤')
      var rowDone = '', rowOpen = ''
      var segs = ''
      for (var i = 0; i < plotW; i++) {
        var p = pts[i]
        if (level < p.done) segs += '<span class="deep">█</span>'
        else if (level < p.total) segs += '<span class="gr">█</span>'
        else segs += ' '
      }
      html += segs + '\n'
    }
    html += ink('dm', padL('0', labelW)) + chrome(' └' + rep('─', plotW)) + '\n'
    var left = PT.shortDate(series[0].ts)
    var right = PT.shortDate(series[series.length - 1].ts)
    html += rep(' ', labelW + 2) + ink('dm', padR(left, Math.max(0, plotW - right.length)) + right) + '\n'
    html += rep(' ', labelW + 2) + ink('deep', '█') + ink('dm', ' done   ') +
      ink('gr', '█') + ink('dm', ' open')
    return html
  }

  /* ======================================================================
     REPLAY — the signature feature.

     Steps PT.snapshotAt() day by day and redraws one board block in place.
     Under reduced motion it never auto-advances: the scrub bar and the arrow
     keys are the whole interface.
     ==================================================================== */

  function replayCounts(R) {
    var m = R.block && R.block.model
    var c = { done: 0, doing: 0, todo: 0 }
    if (!m) return c
    c.done = m.cols.done.length
    c.doing = m.cols.doing.length
    c.todo = m.cols.todo.length
    return c
  }

  function startReplay(daysArg) {
    if (S.replay) exitReplay(true)
    var days = parseInt(daysArg, 10)
    if (!days || days < 3) days = 30
    days = Math.min(120, days)

    var now = Date.now()
    var frames = []
    for (var i = 0; i <= days; i++) frames.push(now - (days - i) * PT.DAY)

    freezeBoards()

    var reduced = PT.reducedMotion()
    var R = {
      frames: frames,
      i: 0,
      playing: !reduced,
      last: 0,
      idx: logIndex(),
      block: null
    }
    S.replay = R

    var b = {
      cls: 'grid',
      kind: 'replay',
      model: null,
      render: function (cols) {
        var R2 = S.replay || this.parked
        var ts = this.parked ? this.parked.ts : R.frames[R.i]
        this.model = snapshotModel(ts, R.idx)
        return drawBoard(this.model, cols) + '\n' + renderScrub(cols, ts, this.model, R2) +
          (this.parked ? '' : transportHTML())
      }
    }
    R.block = b
    mount(b)
    toBottom()

    out(ink('am', '[replay] ') + ink('dm', days + ' days · ') +
      ink('hi', 'space') + ink('dm', ' pause  ') + ink('hi', '← →') + ink('dm', ' step  ') +
      ink('hi', 'esc') + ink('dm', ' exit') +
      (reduced ? ink('dm', '   (reduced motion: stepping only)') : ''), 'flow')

    input.readOnly = true
    input.value = ''
    input.placeholder = 'replay — space pause · ← → step · esc exit'
    $('ps1').classList.add('is-replay')
    $('ps1').innerHTML = '~/pt&nbsp;⏵'
    updateCursor()
    paintStatus()
    if (R.playing) startRaf()
  }

  function transportHTML() {
    return '<div class="chips">' +
      '<button type="button" class="chip" data-rp="prev" aria-label="step back one day">◀ prev</button>' +
      '<button type="button" class="chip" data-rp="play" aria-label="play or pause the replay">⎯⎯ play/pause</button>' +
      '<button type="button" class="chip" data-rp="next" aria-label="step forward one day">next ▶</button>' +
      '<button type="button" class="chip" data-rp="exit" aria-label="exit replay and return to live">esc exit</button>' +
      '</div>'
  }

  function renderScrub(cols, ts, model, R) {
    var w = Math.max(12, Math.min(48, Math.min(cols, 132) - 34))
    var total = R ? R.frames.length : 1
    var i = R ? R.i : 0
    var fill = total > 1 ? Math.round((i / (total - 1)) * w) : w
    var d = new Date(ts)
    var counts = model.cols.done.length + '/' + model.cols.doing.length + '/' + model.cols.todo.length
    return chrome('[') + ink('am', rep('█', fill)) + ink('ru', rep('░', w - fill)) + chrome(']') +
      ink('dm', ' ' + padL(i + 1, 3) + '/' + total + '  ') +
      ink('hi', d.toDateString().slice(0, 10)) +
      ink('dm', '  done/doing/todo ' + counts)
  }

  function stepReplay(delta) {
    var R = S.replay
    if (!R) return
    var next = PT.clamp(R.i + delta, 0, R.frames.length - 1)
    if (next === R.i) {
      if (R.playing && R.i === R.frames.length - 1) {
        R.playing = false
        stopRaf()
        out(ink('am', '[replay] ') + ink('dm', 'end of window · esc to go live, ← to rewind'), 'flow')
        paintStatus()
      }
      return
    }
    R.i = next
    var stick = atBottom()
    render(R.block)
    paintStatus()
    if (stick) toBottom()
  }

  function exitReplay(quiet) {
    var R = S.replay
    if (!R) return
    stopRaf()
    // Park the block: it keeps the day it stopped on, minus the live controls.
    R.block.parked = { ts: R.frames[R.i] }
    S.replay = null
    render(R.block)

    input.readOnly = false
    input.placeholder = ''
    $('ps1').classList.remove('is-replay')
    $('ps1').innerHTML = '~/pt&nbsp;&gt;'
    paintStatus()
    updateCursor()
    if (!quiet) {
      out(ink('gr', '[replay] ') + ink('dm', 'back to live.'), 'flow')
      pushBoard()
    }
    input.focus()
  }

  function tick(now) {
    S.raf = requestAnimationFrame(tick)
    var R = S.replay
    if (!R || !R.playing) { if (R) R.last = now; return }
    if (!R.last) R.last = now
    if (now - R.last >= REPLAY_STEP_MS) { R.last = now; stepReplay(1) }
  }
  function startRaf() { if (!S.raf) { S.raf = requestAnimationFrame(tick) } }
  function stopRaf() { if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0 } }

  // Never burn frames on a hidden tab.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopRaf()
    else if (S.replay && S.replay.playing) { S.replay.last = 0; startRaf() }
  })

  /* ======================================================================
     DISPATCH
     ==================================================================== */

  function nearest(word) {
    var best = null, bestScore = 99
    COMMANDS.forEach(function (c) {
      var d = levenshtein(word, c)
      if (d < bestScore) { bestScore = d; best = c }
    })
    return bestScore <= 3 ? best : null
  }
  function levenshtein(a, b) {
    var m = a.length, n = b.length, prev = [], cur = [], i, j
    for (j = 0; j <= n; j++) prev[j] = j
    for (i = 1; i <= m; i++) {
      cur[0] = i
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1))
      }
      for (j = 0; j <= n; j++) prev[j] = cur[j]
    }
    return prev[n]
  }

  function echo(text) {
    out('<span class="echo">~/pt &gt; <b>' + esc(text) + '</b></span>', 'flow')
  }

  function run(raw) {
    var text = raw.trim()
    echo(text)
    if (!text) return

    S.history.push(text)
    if (S.history.length > 100) S.history.shift()
    S.hIdx = -1

    var sp = text.indexOf(' ')
    var cmd = (sp < 0 ? text : text.slice(0, sp)).toLowerCase()
    var rest = sp < 0 ? '' : text.slice(sp + 1)
    var args = rest.trim().length ? rest.trim().split(/\s+/) : []

    switch (cmd) {
      case 'help': case '?': cmdHelp(); break
      case 'ls': case 'l': cmdLs(args[0]); break
      case 'board': case 'b': pushBoard(); break
      case 'cd': cmdCd(rest); break
      case 'add': case 'a': cmdAdd(rest); break
      case 'mv': cmdMv(args[0], args[1]); break
      case 'done': cmdMv(args[0], 'done'); break
      case 'rm': cmdRm(args[0]); break
      case 'next': cmdNext(); break
      case 'stat': case 'stats': cmdStat(); break
      case 'burn': cmdBurn(); break
      case 'replay': startReplay(args[0]); break
      case 'reset':
        PT.reset()
        S.scope = (PT.projects()[0] || {}).id || null
        ok('seed dataset restored — ' + PT.projects().length + ' projects, ' + PT.tasks().length + ' tasks.')
        pushBoard()
        break
      case 'clear': clearScrollback(); break
      default:
        var guess = nearest(cmd)
        err('command not found: ' + cmd + (guess ? '  — did you mean ‘' + guess + '’?' : '') +
          '   type `help`')
    }
  }

  function clearScrollback() {
    S.blocks.length = 0
    S.lines = 0
    liveBoard = null
    stream.innerHTML = ''
  }

  /* ======================================================================
     INPUT — history, completion, block cursor
     ==================================================================== */

  function completions(value) {
    var parts = value.split(/\s+/)
    var lastIsNew = /\s$/.test(value)
    var tokens = lastIsNew ? parts.concat(['']) : parts
    var i = tokens.length - 1
    var head = tokens[0].toLowerCase()
    var frag = tokens[i].toLowerCase()
    var pool = null

    if (i === 0) pool = COMMANDS
    else if (head === 'cd' && i === 1) {
      pool = PT.projects().map(function (p) { return p.name.toLowerCase().replace(/\s+/g, '') })
      pool.push('..')
    } else if (head === 'mv' && i === 2) pool = ['todo', 'doing', 'done']
    else if (head === 'ls' && i === 1) pool = ['done', 'todo', 'doing', 'all']
    if (!pool) return null

    var hits = pool.filter(function (c) { return c.indexOf(frag) === 0 })
    if (!hits.length) return null

    // Extend to the longest shared prefix, the way a shell does.
    var common = hits[0]
    hits.forEach(function (h) {
      var k = 0
      while (k < common.length && k < h.length && common.charAt(k) === h.charAt(k)) k++
      common = common.slice(0, k)
    })
    if (common === frag && hits.length > 1) return { value: null, hits: hits }
    tokens[i] = common
    return { value: tokens.join(' ') + (hits.length === 1 ? ' ' : ''), hits: hits }
  }

  function updateCursor() {
    if (S.replay) { curs.classList.add('hide'); return }
    curs.classList.remove('hide')
    var pos = input.selectionStart == null ? input.value.length : input.selectionStart
    var x = pos * S.cw - input.scrollLeft
    curs.style.transform = 'translateX(' + Math.max(0, x) + 'px)'
    curs.classList.toggle('blink', !PT.reducedMotion())
  }

  input.addEventListener('keydown', function (e) {
    if (S.replay) {
      if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); exitReplay(false); return }
      if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault()
        S.replay.playing = !S.replay.playing
        S.replay.last = 0
        if (S.replay.playing) { if (S.replay.i >= S.replay.frames.length - 1) S.replay.i = 0; startRaf() }
        else stopRaf()
        render(S.replay.block)
        paintStatus()
        return
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault()
        S.replay.playing = false
        stopRaf()
        stepReplay(e.key === 'ArrowRight' ? 1 : -1)
        paintStatus()
        return
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); return }
      return
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault()
      if (!S.history.length) return
      if (S.hIdx === -1) { S.draft = input.value; S.hIdx = S.history.length }
      S.hIdx = Math.max(0, S.hIdx - 1)
      input.value = S.history[S.hIdx]
      queueMicrotask ? queueMicrotask(caretEnd) : setTimeout(caretEnd, 0)
    } else if (e.key === 'ArrowDown') {
      e.preventDefault()
      if (S.hIdx === -1) return
      S.hIdx++
      if (S.hIdx >= S.history.length) { S.hIdx = -1; input.value = S.draft }
      else input.value = S.history[S.hIdx]
      queueMicrotask ? queueMicrotask(caretEnd) : setTimeout(caretEnd, 0)
    } else if (e.key === 'Tab' && !e.shiftKey) {
      // Only swallow Tab when it actually completes something — otherwise it
      // has to keep working as "leave this field".
      var c = completions(input.value)
      if (!c) return
      if (c.value === null) {
        e.preventDefault()
        out(ink('dm', c.hits.join('   ')), 'flow')
        return
      }
      if (c.value === input.value) return
      e.preventDefault()
      input.value = c.value
      caretEnd()
    } else if (e.key === 'Escape') {
      input.value = ''
      S.hIdx = -1
      updateCursor()
    }
  })

  function caretEnd() {
    input.selectionStart = input.selectionEnd = input.value.length
    updateCursor()
  }

  ;['input', 'click', 'keyup', 'select', 'scroll', 'focus'].forEach(function (ev) {
    input.addEventListener(ev, updateCursor)
  })

  $('promptForm').addEventListener('submit', function (e) {
    e.preventDefault()
    if (S.replay) { exitReplay(false); return }
    var v = input.value
    input.value = ''
    updateCursor()
    run(v)
    toBottom()
  })

  /* --- pointer affordances ---------------------------------------------- */

  stream.addEventListener('click', function (e) {
    var rp = e.target.closest ? e.target.closest('[data-rp]') : null
    if (rp && S.replay) {
      var act = rp.getAttribute('data-rp')
      if (act === 'prev' || act === 'next') {
        S.replay.playing = false; stopRaf()
        stepReplay(act === 'next' ? 1 : -1)
      } else if (act === 'play') {
        S.replay.playing = !S.replay.playing
        S.replay.last = 0
        if (S.replay.playing) { if (S.replay.i >= S.replay.frames.length - 1) S.replay.i = 0; startRaf() }
        else stopRaf()
        render(S.replay.block)
      } else if (act === 'exit') { exitReplay(false); return }
      paintStatus()
      input.focus()
      return
    }

    var cell = e.target.closest ? e.target.closest('.cell') : null
    if (cell) {
      var n = cell.getAttribute('data-n')
      var st = cell.getAttribute('data-status')
      var pre = st === 'todo' ? 'mv ' + n + ' doing'
        : st === 'doing' ? 'done ' + n
        : 'mv ' + n + ' todo'
      input.value = pre
      input.focus()
      caretEnd()
    }
  })

  // Classic terminal contract: clicking the void puts you back on the prompt —
  // but never while the user is selecting text to copy.
  sb.addEventListener('mouseup', function (e) {
    if (S.replay) return
    var sel = window.getSelection && window.getSelection().toString()
    if (sel) return
    var t = e.target
    if (t.closest && t.closest('button, a, input')) return
    input.focus()
  })

  $('btnHelp').addEventListener('click', function () { run('help'); toBottom(); input.focus() })
  $('btnReset').addEventListener('click', function () { run('reset'); toBottom(); input.focus() })

  /* ======================================================================
     MEASUREMENT & REFLOW
     ==================================================================== */

  function measure() {
    meas.textContent = rep('M', 100)
    var w = meas.getBoundingClientRect().width / 100
    if (!w || !isFinite(w)) w = 8
    S.cw = w
    document.documentElement.style.setProperty('--cw', w + 'px')
    var avail = stream.clientWidth || sb.clientWidth || 640
    var cols = Math.max(34, Math.floor(avail / w))
    var changed = cols !== S.cols
    S.cols = cols
    return changed
  }

  var reflowT = 0
  function scheduleReflow() {
    clearTimeout(reflowT)
    reflowT = setTimeout(function () {
      if (!measure()) { updateCursor(); return }
      // Silence the live region for the reflow, or every resize re-announces
      // the entire scrollback.
      stream.setAttribute('aria-live', 'off')
      var stick = atBottom()
      for (var i = 0; i < S.blocks.length; i++) render(S.blocks[i])
      if (stick) toBottom()
      updateCursor()
      setTimeout(function () { stream.setAttribute('aria-live', 'polite') }, 60)
    }, 120)
  }

  if (window.ResizeObserver) {
    new ResizeObserver(scheduleReflow).observe(sb)
  } else {
    window.addEventListener('resize', scheduleReflow)
  }

  /* ======================================================================
     KERNEL SUBSCRIPTION
     Only the newest board is live; history stays as it was printed.
     ==================================================================== */

  PT.on('change', function () {
    if (S.scope && !PT.project(S.scope)) S.scope = (PT.projects()[0] || {}).id || null
    paintStatus()
    if (liveBoard && !S.replay) {
      var stick = atBottom()
      render(liveBoard)
      if (stick) toBottom()
    }
  })

  /* ======================================================================
     BOOT
     ==================================================================== */

  function bootLines() {
    var s = PT.stats()
    var m = PT.momentum(14)
    var ps = PT.projects().length
    return [
      [ink('dm', 'pt terminal') + ink('ru', ' · ') + ink('dm', 'phosphor build'), 0],
      [ink('dm', 'kernel   ') + ink('gr', 'ok') + ink('ru', '   window.PT, classic script, no network'), 0],
      [ink('dm', 'store    ') + ink('gr', 'ok') + ink('ru', '   localStorage · pt-lab-v2'), 0],
      [ink('dm', 'index    ') + ink('hi', ps + ' projects') + ink('ru', ' · ') + ink('hi', s.total + ' tasks') +
        ink('ru', '  (') + ink('gr', s.done + ' done') + ink('ru', ', ') + ink('am', s.doing + ' doing') +
        ink('ru', ', ' + s.todo + ' todo)'), 0],
      [ink('dm', 'pressure ') + (s.overdue ? ink('rd', s.overdue + ' overdue') : ink('gr', 'clear')) +
        ink('ru', ' · ') + ink('hi', s.hoursLeft + 'h') + ink('ru', ' of estimate open'), 0],
      [ink('dm', 'velocity ') + ink('hi', m.perWeek + ' tasks/week') + ink('ru', '  over ' + m.windowDays + 'd'), 0],
      [ink('ru', 'type ') + ink('gr', 'help') + ink('ru', ' for commands · ') + ink('gr', 'replay 30') +
        ink('ru', ' to time-travel the board'), 0]
    ]
  }

  function boot() {
    measure()
    paintStatus()
    var lines = bootLines()
    var reduced = PT.reducedMotion()

    if (reduced) {
      lines.forEach(function (l) { out(l[0], 'flow') })
      pushBoard()
      input.focus()
      updateCursor()
      return
    }

    // Under 1.2s total: 7 lines at 130ms, then the board.
    var i = 0
    ;(function step() {
      if (i >= lines.length) {
        pushBoard()
        input.focus()
        updateCursor()
        return
      }
      out(lines[i][0], 'flow')
      toBottom()
      i++
      setTimeout(step, 130)
    })()
  }

  try {
    boot()
  } catch (e) {
    stream.innerHTML = '<div class="blk flow rd">pt: boot failed — ' + esc(e && e.message) + '</div>'
    if (window.console) console.error(e)
  }
})()
</script>
</body>
</html>
