<!doctype html>
<html lang="en" data-variant="console" data-pal="ember" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tracker — three directions</title>
<meta name="description" content="Three art directions for the Project Tracker dashboard, over one set of data, plus six original palettes.">
<style>
/* ============================================================================
   THREE DIRECTIONS, ONE DASHBOARD

   The markup below is rendered once. Everything that separates the three
   directions is CSS hanging off [data-variant], and everything that separates
   the palettes is CSS hanging off [data-pal][data-mode]. That is the whole
   point of the exercise: if a direction needs different MARKUP to work, it is
   a different app, not a different design — and picking it would mean a
   rewrite rather than a re-skin.
   ========================================================================== */

/* ---- palettes -------------------------------------------------------------
   Six new families, none of them a variation on the five already shipped
   (violet, cream/red, newsprint, cyanotype, phosphor). Every `--muted` is
   solved to clear 4.5:1 against surface-2, which is the tightest of the three
   backgrounds it sits on.
   ------------------------------------------------------------------------ */

/* EMBER — cold forge, hot metal */
[data-pal='ember'][data-mode='dark'] {
  --bg:#12100e; --surface:#1a1714; --surface2:#241f1a;
  --border:#3d3229; --border-soft:#2b241d;
  --fg:#f5ede4; --muted:#a2937f; --brand:#ff7a18; --brand-2:#ff9a4d;
  --ok:#7fc98a; --warn:#e8b13c; --scheme:dark;
}
[data-pal='ember'][data-mode='light'] {
  --bg:#faf6f1; --surface:#fffdfa; --surface2:#f0e8de;
  --border:#d0bda6; --border-soft:#e6d9c9;
  --fg:#1a140e; --muted:#6a5b4c; --brand:#b8410a; --brand-2:#d4530f;
  --ok:#3f7d55; --warn:#a06a12; --scheme:light;
}

/* ORCHID — deep plum with an acid edge. The one pairing nobody expects. */
[data-pal='orchid'][data-mode='dark'] {
  --bg:#150e18; --surface:#1e1423; --surface2:#291b2f;
  --border:#45304d; --border-soft:#33223a;
  --fg:#f2e9f5; --muted:#a08bab; --brand:#b8e62e; --brand-2:#cbf053;
  --ok:#7ddba0; --warn:#e8b13c; --scheme:dark;
}
[data-pal='orchid'][data-mode='light'] {
  --bg:#f8f4f9; --surface:#fffdff; --surface2:#efe6f2;
  --border:#cbb5d2; --border-soft:#e0d1e6;
  --fg:#1c101f; --muted:#69566f; --brand:#4f7a00; --brand-2:#639700;
  --ok:#2f7a4e; --warn:#96660f; --scheme:light;
}

/* TIDE — petrol depth, coral surfacing */
[data-pal='tide'][data-mode='dark'] {
  --bg:#061414; --surface:#0a1c1d; --surface2:#0f2729;
  --border:#1d4245; --border-soft:#163336;
  --fg:#dff2f1; --muted:#7ba3a4; --brand:#ff6b5a; --brand-2:#ff8b7d;
  --ok:#5fd6b4; --warn:#e8b13c; --scheme:dark;
}
[data-pal='tide'][data-mode='light'] {
  --bg:#eef5f4; --surface:#f8fbfb; --surface2:#dfeceb;
  --border:#a5c4c2; --border-soft:#c6dcda;
  --fg:#06201f; --muted:#496b6a; --brand:#c2381f; --brand-2:#d64f34;
  --ok:#0f766e; --warn:#a06a12; --scheme:light;
}

/* CLAY — unfired earth, matte and dusty */
[data-pal='clay'][data-mode='dark'] {
  --bg:#16120f; --surface:#1f1a16; --surface2:#2a231d;
  --border:#453a2f; --border-soft:#322a23;
  --fg:#f0e8de; --muted:#9d8e7d; --brand:#d4785a; --brand-2:#e59b7e;
  --ok:#8fae7d; --warn:#d9a441; --scheme:dark;
}
[data-pal='clay'][data-mode='light'] {
  --bg:#f5f1ea; --surface:#fdfbf6; --surface2:#eae3d7;
  --border:#c8b9a4; --border-soft:#dcd1bf;
  --fg:#1e1811; --muted:#695e4e; --brand:#9c4420; --brand-2:#b55731;
  --ok:#4d7c3f; --warn:#96660f; --scheme:light;
}

/* VAPOR — slate at night, magenta and cyan signal */
[data-pal='vapor'][data-mode='dark'] {
  --bg:#0b0e17; --surface:#121724; --surface2:#1a2133;
  --border:#2e3852; --border-soft:#222a3e;
  --fg:#e6ecf7; --muted:#8b9ab5; --brand:#ff2fb3; --brand-2:#ff6cc8;
  --ok:#2ee6d6; --warn:#ffc94d; --scheme:dark;
}
[data-pal='vapor'][data-mode='light'] {
  --bg:#f2f4fa; --surface:#fdfdff; --surface2:#e6eaf5;
  --border:#b4bed6; --border-soft:#d0d8ea;
  --fg:#0e1220; --muted:#55617f; --brand:#b8008a; --brand-2:#d2129c;
  --ok:#0d7d76; --warn:#96660f; --scheme:light;
}

/* BONE — no greys to hide behind. Hard rules, one red. */
[data-pal='bone'][data-mode='light'] {
  --bg:#fffffd; --surface:#ffffff; --surface2:#f1f1ee;
  --border:#141414; --border-soft:#d5d5d0;
  --fg:#000000; --muted:#494944; --brand:#d81e00; --brand-2:#f03a1c;
  --ok:#186a3b; --warn:#8a6100; --scheme:light;
}
[data-pal='bone'][data-mode='dark'] {
  --bg:#0a0a0a; --surface:#101010; --surface2:#1a1a1a;
  --border:#ededea; --border-soft:#2c2c2c;
  --fg:#fafafa; --muted:#a6a6a1; --brand:#ff3b1f; --brand-2:#ff6a52;
  --ok:#4ade80; --warn:#fbbf24; --scheme:dark;
}

/* The five already in the app, so the new ones can be judged against them. */
[data-pal='original'][data-mode='dark'] {
  --bg:#07070a; --surface:#0e0e14; --surface2:#14141c; --border:#23232e;
  --border-soft:#1a1a24; --fg:#ecedf2; --muted:#8b8c9a; --brand:#7c5cff;
  --brand-2:#a68dff; --ok:#10b981; --warn:#f59e0b; --scheme:dark;
}
[data-pal='original'][data-mode='light'] {
  --bg:#f6f6fb; --surface:#ffffff; --surface2:#eeeef6; --border:#d9d9e6;
  --border-soft:#e7e7f1; --fg:#15151d; --muted:#5f5f6e; --brand:#5b3df0;
  --brand-2:#7c5cff; --ok:#047857; --warn:#b45309; --scheme:light;
}
[data-pal='paper'][data-mode='light'] {
  --bg:#f7f4ec; --surface:#fffdf7; --surface2:#efeade; --border:#cfc7b8;
  --border-soft:#ded6c6; --fg:#14110c; --muted:#6e685c; --brand:#a4291f;
  --brand-2:#c2503f; --ok:#3f7d55; --warn:#b06d10; --scheme:light;
}
[data-pal='paper'][data-mode='dark'] {
  --bg:#100d09; --surface:#1a1610; --surface2:#241f17; --border:#413729;
  --border-soft:#2d2720; --fg:#f2ece0; --muted:#9a9180; --brand:#e0574a;
  --brand-2:#ef7b6d; --ok:#6bbf8a; --warn:#d99a2b; --scheme:dark;
}
[data-pal='terminal'][data-mode='dark'] {
  --bg:#050c08; --surface:#08110b; --surface2:#0c1a11; --border:#1c3a27;
  --border-soft:#142b1d; --fg:#d8f5e2; --muted:#5c8b6e; --brand:#4ade80;
  --brand-2:#86efac; --ok:#4ade80; --warn:#fbbf24; --scheme:dark;
}
[data-pal='terminal'][data-mode='light'] {
  --bg:#e7efe8; --surface:#f3f8f3; --surface2:#dae7dd; --border:#a6c2af;
  --border-soft:#c4d9ca; --fg:#091a10; --muted:#4f6959; --brand:#157f3c;
  --brand-2:#1a9c4b; --ok:#157f3c; --warn:#a4610a; --scheme:light;
}

/* ---- shared shell --------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: var(--scheme); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
}
:root {
  --body: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace;
  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --radius: 12px; --pad: 14px; --gap: 12px; --rule: 1px;
  --title-size: .68rem; --title-space: .18em; --title-weight: 600;
  --cast: 0 0 0 transparent;
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---- the chooser (deliberately neutral — it is not part of any direction) -- */
.lab {
  position: sticky; top: 0; z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 11px;
}
.lab strong { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.lab .sp { flex: 1 }
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg label { cursor: pointer; padding: 5px 10px; text-transform: uppercase; letter-spacing: .1em; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--brand); color: var(--bg); }
.pals { display: flex; flex-wrap: wrap; gap: 5px; }
.pal { cursor: pointer; position: relative; }
.pal input { position: absolute; opacity: 0; pointer-events: none; }
.pal span {
  display: block; width: 30px; height: 20px; border-radius: 5px;
  border: 1px solid rgba(128,128,128,.45);
}
.pal label { display: block }
.pal:has(input:checked) span { outline: 2px solid var(--brand); outline-offset: 2px; }
.pal em { display: block; font-style: normal; font-size: 8px; letter-spacing: .08em;
  text-transform: uppercase; text-align: center; margin-top: 2px; opacity: .65 }
.lab a { color: inherit; opacity: .7 }

/* ---- app frame ------------------------------------------------------------ */
.app { display: flex; min-height: calc(100dvh - 44px); }
.side {
  width: 208px; flex: 0 0 auto; padding: var(--pad);
  border-right: var(--rule) solid var(--border); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-weight: 700; }
.brand i {
  width: 22px; height: 22px; border-radius: 6px; background: var(--brand);
  display: grid; place-items: center; font-style: normal; font-size: 12px; color: var(--bg);
}
.navgroup { margin-bottom: 16px }
.navgroup h4 {
  margin: 0 0 6px; font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.nav { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
  color: var(--muted); cursor: pointer; font-size: 13px; }
.nav.on { background: var(--surface2); color: var(--fg) }
.nav b { margin-left: auto; font-weight: 400; font-size: 11px; font-family: var(--mono) }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column }
.top {
  display: flex; align-items: center; gap: 10px; padding: 10px var(--pad);
  border-bottom: var(--rule) solid var(--border); background: var(--surface);
}
.top h1 { margin: 0; font-size: 15px; font-weight: 600 }
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted);
}
.board { flex: 1; display: grid; gap: var(--gap); padding: var(--pad);
  grid-template-columns: 1.6fr 1fr; align-content: start }
@media (max-width: 820px) { .board { grid-template-columns: 1fr } .side { display: none } }

.pane {
  background: var(--surface); border: var(--rule) solid var(--border);
  border-radius: var(--radius); box-shadow: var(--cast); overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
.pane > header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px var(--pad); background: var(--surface2);
  border-bottom: var(--rule) solid var(--border);
}
.pane > header h3 {
  margin: 0; font-size: var(--title-size); font-weight: var(--title-weight);
  letter-spacing: var(--title-space); text-transform: uppercase; color: var(--muted);
}
.pane > header .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted) }
.pane > div { padding: var(--pad) }
.span2 { grid-column: 1 / -1 }

/* columns of tasks */
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap) }
@media (max-width: 620px) { .cols { grid-template-columns: 1fr } }
.col h5 {
  margin: 0 0 8px; font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  border-bottom: var(--rule) solid var(--border-soft); padding-bottom: 5px;
  display: flex;
}
.col h5 span { margin-left: auto; font-family: var(--mono) }
.task {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--bg); border: var(--rule) solid var(--border);
  border-radius: calc(var(--radius) - 4px);
  padding: 9px 10px; margin-bottom: 7px;
}
.task .t { display: block; font-size: 13px; line-height: 1.35 }
.task .m {
  display: flex; align-items: center; gap: 5px; margin-top: 5px;
  font-family: var(--mono); font-size: 10px; color: var(--muted);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto }
.p-high .dot { background: var(--brand) } .p-med .dot { background: var(--warn) }
.task.done .t { text-decoration: line-through; color: var(--muted) }

/* figures */
.fig { display: flex; align-items: baseline; justify-content: space-between;
  padding: 5px 0; border-bottom: var(--rule) solid var(--border-soft); font-size: 13px }
.fig:last-child { border-bottom: 0 }
.fig b { font-family: var(--mono); font-size: 13px }
.fig span { color: var(--muted) }
.next { font-size: 15px; font-weight: 600; line-height: 1.3; margin: 0 0 4px }
.why { font-family: var(--mono); font-size: 10px; color: var(--muted); margin: 0 0 10px }
.btn {
  border: var(--rule) solid var(--brand); background: color-mix(in srgb, var(--brand) 14%, transparent);
  color: var(--fg); border-radius: calc(var(--radius) - 5px); padding: 6px 12px; font-size: 12px;
  cursor: pointer;
}
.note { font-size: 12px; line-height: 1.5; padding: 8px 0;
  border-bottom: var(--rule) solid var(--border-soft) }
.note:last-child { border-bottom: 0 }
.note em { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--muted);
  display: block; margin-top: 3px }

/* ============================================================================
   A · CONSOLE — instrument density
   Cards dissolve into rules. Everything is a readout, aligned to a 4px grid,
   monospace throughout. The chrome gets out of the way so more fits on screen.
   ========================================================================== */
[data-variant='console'] {
  --radius: 3px; --pad: 9px; --gap: 7px; --rule: 1px;
  --body: var(--mono);
  --title-size: .6rem; --title-space: .2em;
}
[data-variant='console'] .task {
  border-radius: 0; border: 0; border-left: 2px solid var(--border);
  margin-bottom: 0; padding: 5px 8px; background: transparent;
}
[data-variant='console'] .task + .task { border-top: 1px solid var(--border-soft) }
[data-variant='console'] .task:hover { background: var(--surface2) }
[data-variant='console'] .task.p-high { border-left-color: var(--brand) }
[data-variant='console'] .task.p-med { border-left-color: var(--warn) }
[data-variant='console'] .task .t { font-size: 12px }
[data-variant='console'] .dot { border-radius: 0; width: 6px; height: 6px }
[data-variant='console'] .pane { border-radius: 3px }
[data-variant='console'] .fig { padding: 3px 0; font-size: 12px }
[data-variant='console'] .btn { border-radius: 2px }
[data-variant='console'] .nav { border-radius: 2px; font-size: 12px }
[data-variant='console'] .top h1 { font-size: 13px; letter-spacing: .04em }

/* ============================================================================
   B · QUIET — editorial calm
   No borders anywhere. Separation is whitespace, and hierarchy is type. The
   board stops looking like a control panel and starts reading like a page.
   ========================================================================== */
[data-variant='quiet'] {
  --radius: 0px; --pad: 26px; --gap: 30px; --rule: 0px;
  --body: var(--serif);
  --title-size: .62rem; --title-space: .22em; --title-weight: 500;
}
[data-variant='quiet'] .pane { background: transparent; border: 0 }
[data-variant='quiet'] .pane > header { background: transparent; padding: 0 0 10px;
  border-bottom: 1px solid var(--border-soft); margin-bottom: 14px }
[data-variant='quiet'] .pane > div { padding: 0 }
[data-variant='quiet'] .side { background: transparent; border-right: 0 }
[data-variant='quiet'] .top { background: transparent; border-bottom: 1px solid var(--border-soft) }
[data-variant='quiet'] .top h1 { font-size: 22px; font-weight: 500; letter-spacing: -.01em }
[data-variant='quiet'] .task {
  background: transparent; border: 0; border-radius: 0;
  padding: 10px 0 10px 14px; margin-bottom: 0;
  border-left: 2px solid transparent;
}
[data-variant='quiet'] .task + .task { border-top: 1px solid var(--border-soft) }
[data-variant='quiet'] .task:hover { border-left-color: var(--border) }
[data-variant='quiet'] .task.p-high { border-left-color: var(--brand) }
[data-variant='quiet'] .task .t { font-size: 15px; line-height: 1.45 }
[data-variant='quiet'] .task .m { font-size: 10px; letter-spacing: .06em }
[data-variant='quiet'] .dot { display: none }
[data-variant='quiet'] .col h5 { border-bottom: 0; margin-bottom: 2px }
[data-variant='quiet'] .fig { border-bottom: 0; padding: 3px 0 }
[data-variant='quiet'] .fig b { font-size: 15px }
[data-variant='quiet'] .next { font-size: 19px; font-weight: 500; line-height: 1.35 }
[data-variant='quiet'] .nav { font-size: 14px }
[data-variant='quiet'] .btn { border-radius: 999px; padding: 7px 16px }
[data-variant='quiet'] .note { border-bottom: 0; padding: 6px 0 }
[data-variant='quiet'] .board { grid-template-columns: 1.7fr 1fr }

/* ============================================================================
   C · SIGNAL — bold and tactile
   Thick rules, deep radii, and priority carried by a whole tinted field rather
   than a 7px dot. Targets grow. Reads at arm's length and on a phone.
   ========================================================================== */
[data-variant='signal'] {
  --radius: 18px; --pad: 16px; --gap: 14px; --rule: 2px;
  --title-size: .64rem; --title-space: .14em; --title-weight: 700;
  --cast: 0 3px 0 var(--border);
}
[data-variant='signal'] .pane > header { padding: 11px var(--pad) }
[data-variant='signal'] .task {
  border-width: 2px; border-radius: 13px; padding: 12px 13px; margin-bottom: 9px;
}
[data-variant='signal'] .task .t { font-size: 14px; font-weight: 600 }
[data-variant='signal'] .task.p-high {
  background: color-mix(in srgb, var(--brand) 15%, var(--bg));
  border-color: var(--brand);
}
[data-variant='signal'] .task.p-med {
  background: color-mix(in srgb, var(--warn) 13%, var(--bg));
  border-color: color-mix(in srgb, var(--warn) 55%, var(--border));
}
[data-variant='signal'] .task:active { transform: scale(.98) }
[data-variant='signal'] .task { transition: transform .12s cubic-bezier(.34,1.56,.64,1) }
[data-variant='signal'] .dot { width: 9px; height: 9px }
[data-variant='signal'] .btn { border-width: 2px; border-radius: 999px; padding: 9px 18px;
  font-weight: 600 }
[data-variant='signal'] .nav { border-radius: 11px; padding: 9px 10px }
[data-variant='signal'] .nav.on { background: color-mix(in srgb, var(--brand) 18%, transparent) }
[data-variant='signal'] .brand i { border-radius: 9px }
[data-variant='signal'] .top h1 { font-size: 17px; font-weight: 700 }
[data-variant='signal'] .col h5 { font-size: 10px; border-bottom-width: 2px }
[data-variant='signal'] .fig b { font-size: 15px; font-weight: 700 }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important }
}
</style>
</head>
<body>

<div class="lab">
  <strong>Direction</strong>
  <div class="seg" role="radiogroup" aria-label="Art direction">
    <label>A · Console<input type="radio" name="variant" value="console" checked></label>
    <label>B · Quiet<input type="radio" name="variant" value="quiet"></label>
    <label>C · Signal<input type="radio" name="variant" value="signal"></label>
  </div>

  <strong>Palette</strong>
  <div class="pals" id="pals" role="radiogroup" aria-label="Palette"></div>

  <div class="seg" role="radiogroup" aria-label="Mode">
    <label>Dark<input type="radio" name="mode" value="dark" checked></label>
    <label>Light<input type="radio" name="mode" value="light"></label>
  </div>

  <span class="sp"></span>
  <a href="./">← lab index</a>
</div>

<div class="app">
  <aside class="side">
    <div class="brand"><i>▦</i> Project Tracker</div>
    <div class="navgroup">
      <h4>Workspace</h4>
      <div class="nav on">Dashboard</div>
      <div class="nav">List</div>
    </div>
    <div class="navgroup">
      <h4>Projects</h4>
      <div id="projnav"></div>
    </div>
    <div class="navgroup">
      <h4>More</h4>
      <div class="nav">Calendar</div>
      <div class="nav">Reports</div>
      <div class="nav">Versions</div>
      <div class="nav">Settings</div>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <h1>Dashboard</h1>
      <span class="chip" id="chip"></span>
    </div>

    <div class="board">
      <section class="pane span2">
        <header><h3>List</h3><span class="n" id="n-list"></span></header>
        <div class="cols" id="cols"></div>
      </section>

      <section class="pane">
        <header><h3>Priorities</h3></header>
        <div id="next"></div>
      </section>

      <section class="pane">
        <header><h3>Progress</h3></header>
        <div id="figs"></div>
      </section>

      <section class="pane span2">
        <header><h3>Notes</h3><span class="n">3</span></header>
        <div id="notes"></div>
      </section>
    </div>
  </div>
</div>

<script src="./_kernel.js"></script>
<script>
(function () {
  'use strict'

  var PALETTES = [
    ['ember',    'Ember',    '#12100e', '#ff7a18'],
    ['orchid',   'Orchid',   '#150e18', '#b8e62e'],
    ['tide',     'Tide',     '#061414', '#ff6b5a'],
    ['clay',     'Clay',     '#16120f', '#d4785a'],
    ['vapor',    'Vapor',    '#0b0e17', '#ff2fb3'],
    ['bone',     'Bone',     '#0a0a0a', '#ff3b1f'],
    ['original', 'Original', '#07070a', '#7c5cff'],
    ['paper',    'Paper',    '#100d09', '#e0574a'],
    ['terminal', 'Terminal', '#050c08', '#4ade80']
  ]

  var root = document.documentElement
  var pals = document.getElementById('pals')

  PALETTES.forEach(function (p, i) {
    var wrap = document.createElement('div')
    wrap.className = 'pal'
    var lab = document.createElement('label')
    lab.title = p[1]
    lab.innerHTML =
      '<input type="radio" name="pal" value="' + p[0] + '"' + (i === 0 ? ' checked' : '') + '>' +
      '<span style="background:linear-gradient(135deg,' + p[2] + ' 0 52%,' + p[3] + ' 52% 100%)"></span>' +
      '<em>' + p[1] + '</em>'
    wrap.appendChild(lab)
    pals.appendChild(wrap)
  })

  // One listener for all three radio groups — they all do the same thing.
  document.addEventListener('change', function (e) {
    var t = e.target
    if (t.name === 'variant') root.dataset.variant = t.value
    if (t.name === 'pal') root.dataset.pal = t.value
    if (t.name === 'mode') root.dataset.mode = t.value
  })

  /* ---- content, straight from the shared kernel so all three directions are
     judged on the same data rather than on flattering placeholders ---- */
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    })
  }

  var proj = PT.projects()[0]
  var all = PT.tasks({ project: proj.id })
  var COLS = [['todo', 'To do'], ['doing', 'In progress'], ['done', 'Done']]

  document.getElementById('projnav').innerHTML = PT.projects().map(function (p, i) {
    var open = PT.tasks({ project: p.id }).filter(function (t) { return t.status !== 'done' }).length
    return '<div class="nav' + (i === 0 ? ' on' : '') + '">' + esc(p.name) + '<b>' + open + '</b></div>'
  }).join('')

  document.getElementById('cols').innerHTML = COLS.map(function (c) {
    var items = all.filter(function (t) { return t.status === c[0] }).slice(0, 5)
    return '<div class="col"><h5>' + c[1] + '<span>' + items.length + '</span></h5>' +
      items.map(function (t) {
        var cls = 'task p-' + (t.priority === 'high' ? 'high' : t.priority === 'medium' ? 'med' : 'low') +
          (t.status === 'done' ? ' done' : '')
        var due = t.due ? new Date(t.due) : null
        return '<button class="' + cls + '"><span class="t">' + esc(t.title) + '</span>' +
          '<span class="m"><i class="dot"></i>' + t.priority +
          (due ? ' · ' + due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '') +
          '</span></button>'
      }).join('') + '</div>'
  }).join('')

  document.getElementById('n-list').textContent = all.length

  var s = PT.stats(proj.id)
  var m = PT.momentum(28)
  var f = PT.forecast(proj.id)
  document.getElementById('chip').textContent =
    s.overdue + ' overdue · ' + (s.total - s.done) + ' open · ' + m.perWeek + '/wk'

  document.getElementById('figs').innerHTML = [
    ['To do', s.todo], ['In progress', s.doing], ['Done', s.done + ' / ' + s.total],
    ['Overdue', s.overdue], ['Complete', s.pct + '%'], ['Pace', m.perWeek + '/wk'],
    ['Lands', f && f.date ? f.date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'no pace']
  ].map(function (r) {
    return '<div class="fig"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'
  }).join('')

  var n = PT.nextAction(proj.id)
  document.getElementById('next').innerHTML = n
    ? '<p class="next">' + esc(n.task.title) + '</p>' +
      '<p class="why">' + esc(n.why || 'highest ranked') + '</p>' +
      '<button class="btn">Start it</button>'
    : '<p class="why">Nothing open.</p>'

  document.getElementById('notes').innerHTML = [
    ['Ask design whether the locked board should remember per-project layouts', 'general · 2d'],
    ['The forecast should probably ignore tasks with no estimate', proj.name + ' · 5d'],
    ['Try a weekly digest email — one line per project', 'general · 1w']
  ].map(function (x) {
    return '<div class="note">' + esc(x[0]) + '<em>' + esc(x[1]) + '</em></div>'
  }).join('')
})()
</script>
</body>
</html>
